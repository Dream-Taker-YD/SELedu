<!doctype html><html><head><meta charset=utf8><meta name=viewport content="width=device-width,initial-scale=1"><style>:root{color-scheme:light}body{margin:0;padding:0;font:14px -apple-system,BlinkMacSystemFont,sans-serif;background:#fff;color:#000}img{max-width:100%}[hidden]:not([hidden=until-found i]){display:none!important}</style></head><body>
<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>말꽃 마을 - 따뜻한 말 보드게임</title>
<style>
:root{
  --bg:#fff8ef; --ink:#3b2f2f; --soft:#7a6a63; --card:#ffffff;
  --coral:#ff7a6b; --mint:#4cc9a6; --sky:#5aa9e6; --gold:#ffbf3c; --line:#f0e2d3;
}
*{box-sizing:border-box}
html,body{margin:0;height:100%}
body{background:var(--bg);color:var(--ink);font-family:"Pretendard","Apple SD Gothic Neo","Malgun Gothic","맑은 고딕","Noto Sans KR",sans-serif;overflow-x:hidden}
button{font-family:inherit;cursor:pointer;border:none;border-radius:14px;font-weight:700;transition:transform .1s, box-shadow .1s}
button:active{transform:scale(.97)}
.btn{background:var(--coral);color:#fff;padding:12px 22px;font-size:18px;box-shadow:0 4px 0 #d95a4d}
.btn.mint{background:var(--mint);box-shadow:0 4px 0 #2fa585}
.btn.sky{background:var(--sky);box-shadow:0 4px 0 #3b86c2}
.btn.gray{background:#e8ddd3;color:var(--ink);box-shadow:0 4px 0 #cbbcae}
.btn.gold{background:var(--gold);color:#4a3500;box-shadow:0 4px 0 #d69a16}
.btn:disabled{opacity:.45;cursor:not-allowed}
.hidden{display:none!important}

/* ---------- 시작 화면 ---------- */
#setup{min-height:100vh;display:flex;align-items:center;justify-content:center;padding:24px}
.setup-box{background:var(--card);border-radius:28px;padding:32px 36px;max-width:760px;width:100%;box-shadow:0 10px 40px rgba(120,80,40,.12)}
.logo{text-align:center;font-size:54px;margin:0}
.title{text-align:center;font-size:40px;margin:4px 0 2px;letter-spacing:-1px}
.subtitle{text-align:center;color:var(--soft);margin:0 0 22px;font-size:17px}
.row{display:flex;gap:14px;align-items:center;flex-wrap:wrap;margin:12px 0}
.row label{font-weight:700;min-width:110px}
select,input[type=text]{font-family:inherit;font-size:17px;padding:9px 12px;border:2px solid var(--line);border-radius:12px;background:#fffdfa}
.team-inputs{display:grid;grid-template-columns:repeat(auto-fill,minmax(200px,1fr));gap:10px;margin:10px 0 4px}
.team-inputs div{display:flex;align-items:center;gap:6px}
.team-inputs input{width:100%}
.setup-actions{display:flex;gap:12px;justify-content:center;flex-wrap:wrap;margin-top:22px}
.goal-note{font-size:14px;color:var(--soft)}

/* ---------- 게임 화면 ---------- */
#game{display:flex;gap:18px;padding:14px;min-height:100vh;align-items:flex-start;justify-content:center}
#boardWrap{width:min(calc(100vh - 28px), 70vw);aspect-ratio:1/1;flex-shrink:0}
#board{display:grid;grid-template-columns:repeat(7,1fr);grid-template-rows:repeat(7,1fr);gap:5px;width:100%;height:100%}
.cell{border-radius:12px;position:relative;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:3px;text-align:center;box-shadow:inset 0 -4px 0 rgba(0,0,0,.08);border:2px solid rgba(255,255,255,.7)}
.cell .ic{font-size:clamp(16px,2.6vw,34px);line-height:1}
.cell .nm{font-size:clamp(9px,1.05vw,15px);font-weight:800;margin-top:2px;line-height:1.1;word-break:keep-all}
.cell .num{position:absolute;top:2px;left:5px;font-size:10px;color:rgba(0,0,0,.35);font-weight:700}
.cell.active{outline:4px solid var(--coral);outline-offset:1px;animation:pulse 1s infinite}
@keyframes pulse{50%{outline-color:#ffd0c9}}
.cell .price{position:absolute;top:2px;left:4px;font-size:clamp(8px,.8vw,11px);font-weight:800;color:rgba(0,0,0,.45)}
.cell .owner{position:absolute;top:1px;right:2px;font-size:clamp(9px,1vw,14px);font-weight:800;padding:1px 4px;border-radius:8px;color:#fff;line-height:1.2}
.cell.owned{border-width:4px}
.prop{background:#fff8ec;border-radius:16px;padding:14px 18px;margin:10px 0;display:grid;grid-template-columns:1fr 1fr;gap:6px 18px;font-size:19px}
.prop b{color:#a05a00}
.lvl-table{width:100%;border-collapse:collapse;margin-top:8px;font-size:17px}
.lvl-table td,.lvl-table th{border:1px solid #f0e2d3;padding:6px;text-align:center}
.lvl-table tr.on{background:#fff1c9;font-weight:800}
.money{cursor:pointer;font-weight:800;font-size:15px;color:#a05a00;min-width:62px;text-align:right}
.tokens{position:absolute;bottom:2px;left:0;right:0;display:flex;flex-wrap:wrap;justify-content:center;gap:1px}
.token{width:clamp(14px,1.9vw,26px);height:clamp(14px,1.9vw,26px);border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:clamp(10px,1.3vw,17px);border:2px solid #fff;box-shadow:0 2px 4px rgba(0,0,0,.25)}
.center{grid-column:2/7;grid-row:2/7;background:var(--card);border-radius:22px;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:14px;gap:10px;box-shadow:0 6px 24px rgba(120,80,40,.1)}
.center h2{margin:0;font-size:clamp(18px,2.4vw,32px)}
.turn-badge{font-size:clamp(16px,2vw,26px);font-weight:800;padding:8px 20px;border-radius:999px;color:#fff}
#dice{font-size:clamp(60px,9vw,120px);line-height:1;user-select:none;cursor:pointer;filter:drop-shadow(0 6px 6px rgba(0,0,0,.15))}
#dice.rolling{animation:shake .12s infinite}
@keyframes shake{25%{transform:rotate(-12deg)}75%{transform:rotate(12deg)}}
.hint{color:var(--soft);font-size:clamp(12px,1.2vw,16px)}

/* 사이드 */
#side{width:350px;display:flex;flex-direction:column;gap:12px}
.panel{background:var(--card);border-radius:20px;padding:14px 16px;box-shadow:0 6px 24px rgba(120,80,40,.08)}
.panel h3{margin:0 0 10px;font-size:18px}
.team-row{display:flex;align-items:center;gap:8px;padding:7px 8px;border-radius:12px;margin-bottom:5px}
.team-row.now{background:#fff1e6;outline:2px solid var(--coral)}
.team-row .e{font-size:24px}
.team-row .n{flex:1;font-weight:800;font-size:16px;word-break:keep-all}
.team-row .f{font-weight:800;font-size:18px;min-width:52px;text-align:right}
.mini{background:#f3ebe3;color:var(--ink);width:26px;height:26px;border-radius:8px;font-size:15px;padding:0}
.thermo{display:flex;align-items:center;gap:12px}
.thermo-bar{flex:1;height:26px;background:#f3ebe3;border-radius:999px;overflow:hidden;position:relative}
.thermo-fill{height:100%;width:0;background:linear-gradient(90deg,#ffd166,#ff7a6b);border-radius:999px;transition:width .8s}
.thermo-txt{font-weight:800;font-size:20px;min-width:70px;text-align:right}
.side-btns{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.side-btns .btn{font-size:15px;padding:10px 8px}
.legend{display:grid;grid-template-columns:1fr 1fr;gap:4px 8px;font-size:13px}
.legend span{display:flex;align-items:center;gap:5px}
.legend i{display:inline-block;width:12px;height:12px;border-radius:4px}

/* ---------- 모달 ---------- */
#overlay{position:fixed;inset:0;background:rgba(60,40,30,.45);display:flex;align-items:center;justify-content:center;z-index:50;padding:16px}
.modal{background:var(--card);border-radius:28px;width:min(900px,100%);max-height:94vh;overflow:auto;box-shadow:0 20px 60px rgba(0,0,0,.25);animation:pop .25s}
@keyframes pop{from{transform:scale(.9);opacity:0}}
.m-head{padding:18px 26px;border-radius:28px 28px 0 0;display:flex;align-items:center;gap:12px}
.m-head .ic{font-size:40px}
.m-head h2{margin:0;font-size:28px}
.m-head .who{margin-left:auto;font-weight:800;font-size:18px;background:rgba(255,255,255,.7);padding:6px 14px;border-radius:999px}
.m-body{padding:22px 28px 26px;font-size:21px;line-height:1.55}
.sit{background:#fff6ec;border-left:6px solid var(--gold);border-radius:12px;padding:14px 18px;margin:0 0 16px;font-size:22px;word-break:keep-all}
.bubble{display:inline-block;padding:14px 22px;border-radius:22px;font-size:26px;font-weight:800;position:relative;margin:4px 0 14px}
.bubble.bad{background:#ffe1dd;color:#b3261e}
.bubble.friend{background:#e3f2ff;color:#174a7c}
.opts{display:flex;flex-direction:column;gap:10px}
.opt{background:#fbf6f1;border:3px solid #eadfd4;color:var(--ink);text-align:left;padding:13px 18px;font-size:20px;font-weight:600;border-radius:16px;word-break:keep-all}
.opt:hover{border-color:var(--sky)}
.opt.sel{border-color:var(--sky);background:#eaf5ff}
.opt.good{border-color:var(--mint);background:#e4fbf3}
.opt.bad{border-color:#ff9b91;background:#fff0ee;opacity:.85}
.opt[disabled]{cursor:default}
.slot{margin-bottom:12px}
.slot-label{font-weight:800;font-size:18px;margin-bottom:6px;color:var(--soft)}
.slot-chips{display:flex;gap:10px;flex-wrap:wrap}
.slot-chips .opt{flex:1;min-width:240px}
.feedback{margin-top:16px;padding:14px 18px;border-radius:14px;font-size:19px;word-break:keep-all}
.feedback.ok{background:#e4fbf3;border:2px solid var(--mint)}
.feedback.no{background:#fff3e0;border:2px solid var(--gold)}
.final-say{background:linear-gradient(135deg,#fff3c9,#ffe3dc);border-radius:18px;padding:18px 22px;font-size:25px;font-weight:800;text-align:center;margin:14px 0;word-break:keep-all}
.m-actions{display:flex;gap:12px;justify-content:center;flex-wrap:wrap;margin-top:18px}
.step-tag{display:inline-block;background:var(--ink);color:#fff;border-radius:999px;padding:3px 12px;font-size:15px;margin-bottom:8px}
.face{font-size:80px;text-align:center;line-height:1;margin:4px 0 6px}
.frame{display:grid;gap:8px;margin:10px 0}
.frame div{background:#f6f0ff;border-radius:12px;padding:10px 14px}
.frame b{color:#7b4fd6}
.breath-wrap{display:flex;flex-direction:column;align-items:center;gap:12px;margin:10px 0}
.breath{width:150px;height:150px;border-radius:50%;background:radial-gradient(circle,#a0e7e5,#5aa9e6);display:flex;align-items:center;justify-content:center;color:#fff;font-weight:800;font-size:22px;transform:scale(.6);transition:transform 4s ease-in-out}
.breath.in{transform:scale(1.05)}
.timer{font-size:44px;font-weight:800;text-align:center;color:var(--coral)}
.team-pick{display:flex;gap:10px;flex-wrap:wrap;justify-content:center}
.team-pick button{padding:10px 16px;font-size:18px;border-radius:14px;color:#fff}
.tipbox{background:#f1fbf7;border-radius:14px;padding:12px 16px;font-size:17px;margin-top:12px;color:#2b5d4f;word-break:keep-all}

/* 토스트·폭죽 */
#toast{position:fixed;left:50%;top:22px;transform:translateX(-50%);background:var(--ink);color:#fff;padding:12px 24px;border-radius:999px;font-size:19px;font-weight:700;z-index:80;opacity:0;transition:opacity .3s;pointer-events:none;white-space:nowrap}
#toast.show{opacity:1}
.confetti{position:fixed;top:-40px;font-size:28px;z-index:90;pointer-events:none;animation:fall linear forwards}
@keyframes fall{to{transform:translateY(110vh) rotate(540deg)}}

/* 종료 화면 */
#endScreen{position:fixed;inset:0;background:var(--bg);z-index:70;overflow:auto;padding:30px 20px}
.end-box{max-width:900px;margin:0 auto}
.end-box h1{text-align:center;font-size:40px;margin:0 0 6px}
.rank{display:flex;align-items:center;gap:12px;background:#fff;border-radius:16px;padding:12px 18px;margin:8px 0;font-size:21px;font-weight:700}
.dict{display:grid;grid-template-columns:repeat(auto-fill,minmax(260px,1fr));gap:10px}
.dict div{background:#fff;border-radius:14px;padding:12px 14px;font-size:17px;border-left:5px solid var(--mint);word-break:keep-all}
.reflect{background:#fff;border-radius:18px;padding:16px 22px;font-size:19px;line-height:1.9}

/* 규칙 */
.rules h3{margin:16px 0 6px;font-size:22px}
.rules ul{margin:0;padding-left:22px}
.rules li{margin:3px 0}

@media (max-width:900px){
  #game{flex-direction:column;align-items:center}
  #boardWrap{width:min(96vw,96vh)}
  #side{width:min(96vw,600px)}
}
@media print{
  body{background:#fff}
  #game,#overlay,#toast,.no-print{display:none!important}
  #endScreen{position:static;padding:0}
}
</style>
</head>
<body>

<!-- ============ 시작 화면 ============ -->
<section id="setup">
  <div class="setup-box">
    <p class="logo">🌸🏡💬</p>
    <h1 class="title">말꽃 마을</h1>
    <p class="subtitle">따뜻한 말 미션에 성공하고 마을 땅을 차지하는 의사소통 보드게임</p>

    <div class="row">
      <label for="teamCount">팀 수</label>
      <select id="teamCount">
        <option>2</option><option>3</option><option selected>4</option><option>5</option><option>6</option>
      </select>
    </div>
    <div class="team-inputs" id="teamInputs"></div>

    <div class="row">
      <label for="goalSel">우리 반 목표</label>
      <select id="goalSel">
        <option value="60">마음 온도 60° (짧게, 약 20분)</option>
        <option value="100" selected>마음 온도 100° (보통, 약 40분)</option>
        <option value="150">마음 온도 150° (길게, 2차시)</option>
      </select>
    </div>
    <p class="goal-note">말꽃 1개를 얻을 때마다 우리 반 마음 온도가 3°씩 올라가요. 팀끼리 경쟁하면서도 반 전체가 함께 목표를 이루는 게임이에요.</p>
    <div class="row">
      <label for="startMoney">🪙 초기 자금</label>
      <input type="number" id="startMoney" value="1000" min="0" step="50" style="width:120px;font-size:17px;padding:9px 12px;border:2px solid var(--line);border-radius:12px"> 코인
      <label for="salary" style="min-width:auto;margin-left:14px">💵 한 바퀴 월급</label>
      <input type="number" id="salary" value="200" min="0" step="50" style="width:110px;font-size:17px;padding:9px 12px;border:2px solid var(--line);border-radius:12px"> 코인
    </div>
    <p class="goal-note">땅값은 100 · 150 · 200 · 250코인(뒤로 갈수록 비싸요). 미션에 성공해야 땅을 살 수 있고, 다른 팀 땅에 도착하면 사용료를 내요.</p>
    <div class="row">
      <label for="soundChk">효과음</label>
      <input type="checkbox" id="soundChk" checked style="width:22px;height:22px">
    </div>

    <div class="setup-actions">
      <button class="btn" id="startBtn">🎲 게임 시작</button>
      <button class="btn mint hidden" id="resumeBtn">↩️ 이어서 하기</button>
      <button class="btn gray" id="rulesBtn1">📖 게임 방법</button>
    </div>
  </div>
</section>

<!-- ============ 게임 화면 ============ -->
<section id="game" class="hidden">
  <div id="boardWrap"><div id="board"></div></div>
  <aside id="side">
    <div class="panel">
      <h3>🌡️ 우리 반 마음 온도</h3>
      <div class="thermo">
        <div class="thermo-bar"><div class="thermo-fill" id="thermoFill"></div></div>
        <div class="thermo-txt" id="thermoTxt">0°</div>
      </div>
    </div>
    <div class="panel">
      <h3>🌸 팀별 말꽃</h3>
      <div id="scoreboard"></div>
      <div class="hint" style="margin-top:6px">± 버튼: 선생님이 직접 조정할 때 사용</div>
    </div>
    <div class="panel">
      <h3>🗺️ 칸 안내</h3>
      <div class="legend" id="legend"></div>
    </div>
    <div class="panel side-btns">
      <button class="btn gray" id="rulesBtn2">📖 게임 방법</button>
      <button class="btn sky" id="dictBtn">📚 말 사전</button>
      <button class="btn gold" id="endBtn">🏁 게임 끝내기</button>
      <button class="btn gray" id="homeBtn">🏠 처음으로</button>
    </div>
  </aside>
</section>

<div id="overlay" class="hidden"><div class="modal" id="modal"></div></div>
<div id="toast"></div>
<section id="endScreen" class="hidden"></section>

<script>
/* ==========================================================
   데이터
   ========================================================== */
const TYPES = {
  ST:{name:"출발",icon:"🏁",color:"#ffe08a"},
  IM:{name:"나 전달법",icon:"💬",color:"#ffc4b8"},
  CH:{name:"말 바꾸기",icon:"🔄",color:"#ffdcae"},
  MI:{name:"마음 읽기",icon:"🔍",color:"#c3e6fb"},
  LI:{name:"잘 듣기",icon:"👂",color:"#cff5c7"},
  TO:{name:"말투 연기",icon:"🎭",color:"#e3cdfb"},
  PR:{name:"칭찬 릴레이",icon:"👏",color:"#fbf6b5"},
  AP:{name:"진심 사과",icon:"🤝",color:"#ffd1f7"},
  VI:{name:"짜증 바이러스",icon:"🦠",color:"#d9d4cf"},
  BR:{name:"쉼표",icon:"🫧",color:"#b6eeec"},
  LU:{name:"찬스",icon:"🍀",color:"#b3f1fa"}
};
const BOARD = ["ST","IM","CH","MI","LI","LU","IM","TO","CH","VI","MI","IM","PR","LI","CH","BR","MI","IM","AP","LI","CH","TO","MI","IM"];

/* 점유할 수 있는 땅: 칸 번호 → 이름 */
const LAND_NAMES = {1:"고운말 공원",2:"바른말 시장",3:"마음 숲",4:"귀 기울 언덕",6:"다정 카페",7:"목소리 극장",8:"상냥 빵집",10:"표정 미술관",11:"진심 우체국",13:"경청 도서관",14:"칭찬 꽃집",16:"공감 호수",17:"배려 놀이터",18:"화해 다리",19:"이야기 정원",20:"미소 문방구",21:"말투 방송국",22:"마음 등대",23:"무지개 학교"};
const LEVEL_ICON = ["","🏠","🏡","🏰"];
const LEVEL_NAME = ["","1단계 오두막","2단계 집","3단계 성"];
function isLand(p){return LAND_NAMES[p]!==undefined;}
function landPrice(p){return p<=6?100:p<=12?150:p<=18?200:250;}
function upgradeCost(p){return Math.round(landPrice(p)*0.6/10)*10;}
function toll(p,lv){return Math.round(landPrice(p)*[0,0.5,1.2,2][lv]/10)*10;}
function landValue(p,lv){return landPrice(p)+upgradeCost(p)*(lv-1);}

const TEAM_DEFAULTS = [
  {name:"토끼팀",emoji:"🐰",color:"#ff7a6b"},
  {name:"곰돌이팀",emoji:"🐻",color:"#c58b4e"},
  {name:"여우팀",emoji:"🦊",color:"#ff9f1c"},
  {name:"판다팀",emoji:"🐼",color:"#5c6b73"},
  {name:"호랑이팀",emoji:"🐯",color:"#e85d75"},
  {name:"펭귄팀",emoji:"🐧",color:"#5aa9e6"}
];

/* 나 전달법: 각 칸 [좋은 말, 상처 주는 말] */
const IM_CARDS = [
  {sit:"짝이 내 지우개를 말없이 가져가서 돌려주지 않았어요.",

function freshDeck(n){const a=[...Array(n).keys()];return shuffle(a);}
function shuffle(a){for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]];}return a;}
function esc(s){return String(s).replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));}

function newState(teams,goal,sound,startMoney,salary){
  return {teams,turn:0,temp:0,goal,sound,goalReached:false,dict:[],startMoney,salary,lands:{},
    decks:{IM:freshDeck(IM_CARDS.length),CH:freshDeck(CH_CARDS.length),MI:freshDeck(MI_CARDS.length),LI:freshDeck(LI_CARDS.length),TO:freshDeck(TO_CARDS.length),PR:freshDeck(PR_CARDS.length),AP:freshDeck(AP_CARDS.length),VI:freshDeck(VI_CARDS.length),LU:freshDeck(LU_CARDS.length)}};
}
const DECK_SIZE = {IM:IM_CARDS.length,CH:CH_CARDS.length,MI:MI_CARDS.length,LI:LI_CARDS.length,TO:TO_CARDS.length,PR:PR_CARDS.length,AP:AP_CARDS.length,VI:VI_CARDS.length,LU:LU_CARDS.length};
function draw(type){
  if(!S.decks[type]||!S.decks[type].length) S.decks[type]=freshDeck(DECK_SIZE[type]);
  return S.decks[type].shift();
}
function save(){try{localStorage.setItem(SAVE_KEY,JSON.stringify(S));}catch(e){}}

let actx=null;
function tone(freq,dur=0.12,type="sine",delay=0,vol=0.15){
  if(!S||!S.sound) return;
  try{
    actx = actx || new (window.AudioContext||window.webkitAudioContext)();
    const o=actx.createOscillator(),g=actx.createGain();
    o.type=type;o.frequency.value=freq;g.gain.value=vol;
    o.connect(g);g.connect(actx.destination);
    const t=actx.currentTime+delay;o.start(t);
    g.gain.exponentialRampToValueAtTime(0.001,t+dur);o.stop(t+dur+0.02);
  }catch(e){}
}
const sfx={
  good(){tone(660,.12,"sine",0);tone(880,.18,"sine",.12);},
  bad(){tone(300,.2,"triangle",0);tone(220,.25,"triangle",.15);},
  step(){tone(520,.06,"square",0,.05);},
  win(){[523,659,784,1047].forEach((f,i)=>tone(f,.2,"sine",i*.13));}
};
function toast(msg){const t=document.getElementById("toast");t.textContent=msg;t.classList.add("show");clearTimeout(toast._t);toast._t=setTimeout(()=>t.classList.remove("show"),2200);}
function confetti(n=70){
  const em=["🌸","💖","✨","🌼","💬","🎉"];
  for(let i=0;i<n;i++){
    const d=document.createElement("div");d.className="confetti";
    d.textContent=em[i%em.length];d.style.left=Math.random()*100+"vw";
    d.style.animationDuration=(2.5+Math.random()*2.5)+"s";d.style.animationDelay=(Math.random()*.8)+"s";
    document.body.appendChild(d);setTimeout(()=>d.remove(),6000);
  }
}

function cellPos(i){ // 7x7 테두리, 왼쪽 위부터 시계 방향
  if(i<=6) return [1,i+1];
  if(i<=12) return [i-5,7];
  if(i<=18) return [7,7-(i-12)];
  return [7-(i-18),1];
}
function openGame(){
  document.getElementById("setup").classList.add("hidden");
  document.getElementById("endScreen").classList.add("hidden");
  document.getElementById("game").classList.remove("hidden");
  buildBoard();renderAll();
}
function buildBoard(){
  const b=document.getElementById("board");b.innerHTML="";
  BOARD.forEach((t,i)=>{
    const [r,c]=cellPos(i);const T=TYPES[t];
    const top=isLand(i)?`<span class="price">🪙${landPrice(i)}</span><span class="owner" id="own${i}"></span>`:"";
    b.insertAdjacentHTML("beforeend",`<div class="cell" id="cell${i}" title="${isLand(i)?LAND_NAMES[i]:T.name}" style="grid-row:${r};grid-column:${c};background:${T.color}">${top}<span class="ic">${T.icon}</span><span class="nm">${T.name}</span><div class="tokens" id="tok${i}"></div></div>`);
  });
  b.insertAdjacentHTML("beforeend",`<div class="center">
    <h2>🌸 말꽃 마을 🌸</h2>
    <div class="turn-badge" id="turnBadge"></div>
    <div id="dice" title="클릭하거나 스페이스바를 눌러 굴리기">🎲</div>
    <button class="btn" id="rollBtn">주사위 굴리기</button>
    <div class="hint">따뜻한 말 한마디가 말꽃을 피워요</div>
  </div>`);
  document.getElementById("rollBtn").onclick=roll;
  document.getElementById("dice").onclick=roll;
  document.getElementById("legend").innerHTML=Object.entries(TYPES).filter(([k])=>k!=="ST").map(([k,T])=>`<span><i style="background:${T.color}"></i>${T.icon} ${T.name}</span>`).join("");
}
function renderAll(){
  document.querySelectorAll(".tokens").forEach(t=>t.innerHTML="");
  document.querySelectorAll(".cell").forEach(c=>c.classList.remove("active"));
  S.teams.forEach(tm=>{
    document.getElementById("tok"+tm.pos).insertAdjacentHTML("beforeend",`<div class="token" style="background:${tm.color}" title="${esc(tm.name)}">${tm.emoji}</div>`);
  });
  BOARD.forEach((t,i)=>{
    if(!isLand(i)) return;
    const L=S.lands[i],cell=document.getElementById("cell"+i),o=document.getElementById("own"+i);
    if(L){const ow=S.teams[L.owner];cell.classList.add("owned");cell.style.borderColor=ow.color;o.style.background=ow.color;o.textContent=ow.emoji+LEVEL_ICON[L.level];cell.title=`${LAND_NAMES[i]} · ${ow.name} ${LEVEL_NAME[L.level]} · 사용료 ${toll(i,L.level)}`;}

  });
  const cur=S.teams[S.turn];
  document.getElementById("cell"+cur.pos).classList.add("active");
  const tb=document.getElementById("turnBadge");
  tb.textContent=`${cur.emoji} ${cur.name} 차례`;tb.style.background=cur.color;

    <button class="mini" data-adj="${i}" data-v="-1">−</button>
    <span class="f">🌸 ${tm.flowers}</span>
    <button class="mini" data-adj="${i}" data-v="1">+</button></div>`).join("");
  sb.querySelectorAll("[data-adj]").forEach(b=>b.onclick=()=>{
    const i=+b.dataset.adj,v=+b.dataset.v;award(i,v,true);renderAll();save();
  });

    const i=+b.dataset.money;const v=prompt(`${S.teams[i].name}의 코인을 몇으로 바꿀까요?`,S.teams[i].money);
    if(v!==null&&!isNaN(parseInt(v))){S.teams[i].money=Math.max(0,parseInt(v));renderAll();save();}
  });
  const pct=Math.min(100,S.temp/S.goal*100);

function award(i,n,manual=false){
  const tm=S.teams[i];
  if(n>0){tm.flowers+=n;S.temp+=n*3;}
  else if(n<0){const before=tm.flowers;tm.flowers=Math.max(0,tm.flowers+n);if(manual&&before>tm.flowers)S.temp=Math.max(0,S.temp-3);}
  checkGoal();
}
function checkGoal(){
  if(!S.goalReached && S.temp>=S.goal){
    S.goalReached=true;S.goalPending=true;
  }
}
function showGoal(){
  S.goalPending=false;

      openModal({icon:"🌡️",title:"우리 반 마음 온도 달성!",color:"#ffe08a",who:"우리 반 모두",

        <div class="m-actions"><button class="btn mint" id="goOn">계속하기</button><button class="btn gold" id="goEnd">결과 보기</button></div>`});
      document.getElementById("goOn").onclick=()=>{closeModal();busy=false;};
      document.getElementById("goEnd").onclick=()=>{closeModal();busy=false;showEnd();};

const FACES=["⚀","⚁","⚂","⚃","⚄","⚅"];
function roll(){
  if(busy) return;busy=true;
  const d=document.getElementById("dice");document.getElementById("rollBtn").disabled=true;
  d.classList.add("rolling");
  let k=0;const iv=setInterval(()=>{d.textContent=FACES[Math.floor(Math.random()*6)];tone(400+Math.random()*300,.04,"square",0,.04);if(++k>12){
    clearInterval(iv);d.classList.remove("rolling");
    const n=1+Math.floor(Math.random()*6);d.textContent=FACES[n-1];
    setTimeout(()=>move(n),350);
  }},60);
}
function move(n,then){
  const tm=S.teams[S.turn];let left=n;
  const step=()=>{
    tm.pos=(tm.pos+1)%BOARD.length;sfx.step();
    if(tm.pos===0){award(S.turn,1);tm.money+=S.salary;toast(`🏁 ${tm.name} 한 바퀴! 월급 🪙${S.salary} · 말꽃 +1`);}
    renderAll();
    if(--left>0) setTimeout(step,260);
    else setTimeout(()=>{save();(then||landOn)(tm.pos);},420);
  };
  step();
}
function landOn(pos){
  const type=BOARD[pos];
  const fn={ST:cardStart,IM:cardIM,CH:cardCH,MI:cardMI,LI:cardLI,TO:cardTO,PR:cardPR,AP:cardAP,VI:cardVI,BR:cardBR,LU:cardLU}[type];
  M.ok=false;CTX=null;
  if(!isLand(pos)){fn();return;}
  const L=S.lands[pos];
  if(!L) CTX={pos,kind:"buy"};
  else if(L.owner===S.turn) CTX={pos,kind:"upgrade"};
  else{
    CTX={pos,kind:"toll"};

function landsOf(i){return Object.keys(S.lands).map(Number).filter(p=>S.lands[p].owner===i);}
function landBanner(){
  if(!CTX||CTX.bannerShown) return "";
  CTX.bannerShown=true;const p=CTX.pos,L=S.lands[p];
  if(CTX.kind==="buy") return `<div class="tipbox" style="margin:0 0 14px;background:#fff6dc;color:#7a4b00">🏘️ <b>${LAND_NAMES[p]}</b> · 빈 땅 (🪙${landPrice(p)}) — 미션에 성공하면 이 땅을 살 수 있어요!</div>`;
  if(CTX.kind==="upgrade") return `<div class="tipbox" style="margin:0 0 14px;background:#fff6dc;color:#7a4b00">🏘️ 우리 땅 <b>${LAND_NAMES[p]}</b> (${LEVEL_NAME[L.level]}) — ${L.level<3?`미션에 성공하면 레벨을 올릴 수 있어요!`:`이미 최고 레벨이에요. 미션을 하고 말꽃을 모아요.`}</div>`;
  return "";
}
/* 미션이 끝난 뒤 땅 단계 */
function propertyPhase(){
  if(!CTX){nextTurn();return;}
  const p=CTX.pos,tm=S.teams[S.turn],L=S.lands[p],kind=CTX.kind;CTX=null;
  if(kind==="buy"){
    const price=landPrice(p);
    if(!M.ok){toast(`미션에 실패해서 ${LAND_NAMES[p]}을(를) 살 수 없어요`);nextTurn();return;}
    openModal({icon:"🏘️",title:"땅 사기",color:"#ffe08a",body:`
      <p style="text-align:center;font-size:24px;font-weight:800;margin:0">미션 성공! <b>${LAND_NAMES[p]}</b>을(를) 살까요?</p>
      <div class="prop"><div>땅값</div><div><b>🪙${price}</b></div><div>우리 팀 코인</div><div><b>🪙${tm.money}</b></div></div>
      ${lvlTable(p,1)}
      ${tm.money<price?`<div class="feedback no">코인이 부족해서 살 수 없어요. 다음 기회에!</div>`:""}
      <div class="m-actions"><button class="btn mint" id="buyOk" ${tm.money<price?"disabled":""}>🏠 땅 사기 (−${price})</button><button class="btn gray" id="buyNo">사지 않기</button></div>`});
    document.getElementById("buyOk").onclick=()=>{tm.money-=price;S.lands[p]={owner:S.turn,level:1};closeModal();sfx.win();toast(`🏠 ${tm.name}이(가) ${LAND_NAMES[p]}의 주인이 되었어요!`);nextTurn();};
    document.getElementById("buyNo").onclick=()=>{closeModal();nextTurn();};
  } else if(kind==="upgrade"){
    if(!M.ok||L.level>=3){if(!M.ok)toast("미션에 실패해서 레벨을 올릴 수 없어요");nextTurn();return;}
    const cost=upgradeCost(p);
    openModal({icon:LEVEL_ICON[L.level+1],title:"레벨 올리기",color:"#ffe08a",body:`
      <p style="text-align:center;font-size:24px;font-weight:800;margin:0">미션 성공! <b>${LAND_NAMES[p]}</b>을(를) ${LEVEL_NAME[L.level+1]}로 키울까요?</p>
      <div class="prop"><div>공사비</div><div><b>🪙${cost}</b></div><div>우리 팀 코인</div><div><b>🪙${tm.money}</b></div></div>
      ${lvlTable(p,L.level+1)}
      ${tm.money<cost?`<div class="feedback no">코인이 부족해서 올릴 수 없어요.</div>`:""}
      <div class="m-actions"><button class="btn mint" id="upOk" ${tm.money<cost?"disabled":""}>⬆️ 레벨 올리기 (−${cost})</button><button class="btn gray" id="upNo">그대로 두기</button></div>`});
    document.getElementById("upOk").onclick=()=>{tm.money-=cost;L.level++;closeModal();sfx.win();toast(`${LEVEL_ICON[L.level]} ${LAND_NAMES[p]}이(가) ${LEVEL_NAME[L.level]}이 되었어요!`);nextTurn();};
    document.getElementById("upNo").onclick=()=>{closeModal();nextTurn();};
  } else if(kind==="toll"){
    const ow=S.teams[L.owner];let due=toll(p,L.level);if(M.ok)due=Math.round(due/2/10)*10;
    const sold=[];
    if(tm.money<due){ // 부족하면 땅을 은행에 절반 값에 팔아요(싼 땅부터)
      const mine=landsOf(S.turn).sort((a,b)=>landValue(a,S.lands[a].level)-landValue(b,S.lands[b].level));
      for(const q of mine){if(tm.money>=due)break;const v=Math.round(landValue(q,S.lands[q].level)/2/10)*10;tm.money+=v;sold.push(`${LAND_NAMES[q]}(+${v})`);delete S.lands[q];}
    }
    const paid=Math.min(due,tm.money);tm.money-=paid;ow.money+=paid;
    openModal({icon:"🪙",title:"사용료 내기",color:"#ffe08a",body:`
      <div style="text-align:center"><div class="face">${tm.emoji} ➜ ${ow.emoji}</div>
      <p style="font-size:24px;font-weight:800;margin:0">${esc(tm.name)}이(가) ${esc(ow.name)}에게 🪙${paid}를 냈어요.</p>
      ${M.ok?`<p>미션 성공으로 사용료 반값 할인! 🎉</p>`:""}
      ${sold.length?`<div class="feedback no">코인이 모자라 땅을 은행에 팔았어요: ${sold.join(", ")}</div>`:""}
      ${paid<due?`<div class="feedback no">그래도 ${due-paid}코인이 모자라요. 가진 코인을 모두 냈어요. 월급을 모아 다시 일어서요!</div>`:""}</div>
      <div class="tipbox">돈을 낼 때: “잘 쓰고 가요, 고마워!” · 받을 때: “와 줘서 고마워, 또 와!”</div>
      <div class="m-actions"><button class="btn" id="tollOk">확인</button></div>`});
    sfx.bad();
    document.getElementById("tollOk").onclick=()=>{closeModal();nextTurn();};
  } else nextTurn();
}
function lvlTable(p,hi){
  return `<table class="lvl-table"><tr><th>단계</th><th>모양</th><th>다른 팀이 내는 사용료</th></tr>${[1,2,3].map(l=>`<tr class="${l===hi?"on":""}"><td>${l}단계</td><td>${LEVEL_ICON[l]}</td><td>🪙${toll(p,l)}</td></tr>`).join("")}</table>`;
}
function nextTurn(){
  CTX=null;
  S.turn=(S.turn+1)%S.teams.length;busy=false;

  document.getElementById("dice").textContent="🎲";

}

function openModal({icon,title,color,who,body}){

function head(type){const T=TYPES[type];return {icon:T.icon,title:T.name,color:T.color};}
function setBody(html){document.getElementById("mBody").innerHTML=html;}
function finish(gain,msg){
  closeModal();
  if(gain>0){award(S.turn,gain);sfx.good();toast(`${S.teams[S.turn].emoji} ${msg||"말꽃"} +${gain} 🌸`);}

}
/* 소리 내어 말하기 보너스 단계 */
function speakStep(phrase,earned,extraHtml=""){
  addDict(phrase);
  setBody(`<span class="step-tag">마지막 단계 · 소리 내어 말하기</span>
    <p style="margin:4px 0">팀원 모두 함께, <b>친구 눈을 바라보며 따뜻한 목소리로</b> 말해 보세요.</p>

    <p class="hint" style="text-align:center">다른 팀 친구들이 듣고 엄지 👍를 들어 주면 성공!</p>
    <div class="m-actions"><button class="btn mint" id="spOk">👍 따뜻하게 말했어요 (+1)</button><button class="btn gray" id="spNo">넘어가기</button></div>`);
  document.getElementById("spOk").onclick=()=>finish(earned+1,"따뜻한 말");
  document.getElementById("spNo").onclick=()=>finish(earned,earned>0?"말꽃":"다음엔 꼭 말해 봐요!");
}
/* 객관식 공통: options 배열(첫 번째 정답) → 섞어서 표시, 선택 후 콜백 */
function mcq(container,options,onPick,labels){
  const order=shuffle(options.map((_,i)=>i));
  container.innerHTML=`<div class="opts">${order.map(i=>`<button class="opt" data-i="${i}">${esc(options[i])}</button>`).join("")}</div>`;
  container.querySelectorAll(".opt").forEach(b=>b.onclick=()=>{
    const i=+b.dataset.i;
    container.querySelectorAll(".opt").forEach(x=>{x.disabled=true;const xi=+x.dataset.i;
      if(xi===0)x.classList.add("good");else if(xi===i)x.classList.add("bad");
      if(labels&&labels[xi]&&xi!==0)x.insertAdjacentHTML("beforeend",` <small style="color:#b3261e">← ${labels[xi]}</small>`);});
    i===0?sfx.good():sfx.bad();
    onPick(i===0);
  });
}

function cardIM(){

  openModal({...head("IM"),body:`
    <div class="sit">📌 ${esc(c.sit)}</div>

    ${c.s.map((pair,k)=>`<div class="slot"><div class="slot-label">${IM_LABELS[k]}</div><div class="slot-chips">${orders[k].map(j=>`<button class="opt" data-k="${k}" data-j="${j}">${esc(pair[j])}</button>`).join("")}</div></div>`).join("")}

  document.querySelectorAll("[data-k]").forEach(b=>b.onclick=()=>{

  });
  document.getElementById("imDone").onclick=()=>{

    document.querySelectorAll("[data-k]").forEach(x=>{x.disabled=true;x.classList.remove("sel");const k=+x.dataset.k,j=+x.dataset.j;
      if(j===0)x.classList.add("good");else if(picks[k]===j)x.classList.add("bad");});
    picks.forEach((p,k)=>{if(p===0)right++;else notes.push(`<li>${IM_LABELS[k]}: ${IM_WHY[k]}</li>`);});
    const gain=right===4?2:right===3?1:0;M.ok=right>=3;
    const full=`${c.s[0][0]} ${c.s[1][0]}. ${c.s[2][0]}. ${c.s[3][0]}`;
    right===4?sfx.good():sfx.bad();
    document.getElementById("imDone").parentElement.outerHTML=`
      <div class="feedback ${right===4?"ok":"no"}"><b>${right}/4 정답!</b> ${right===4?"완벽한 나 전달법이에요! 말꽃 +2":right===3?"거의 다 왔어요! 말꽃 +1":"괜찮아요, 바른 문장을 함께 읽어 봐요."}

    document.getElementById("imNext").onclick=()=>speakStep(full,gain,`<div class="tipbox">💡 ${IM_TIP}</div>`);
  };
}

      <div><b>① 잘못 인정하기</b> — 내가 무엇을 했는지 말해요.</div>
      <div><b>② 마음 알아주기</b> — 친구의 마음을 헤아리며 “미안해.”</div>
      <div><b>③ 다짐하기</b> — 앞으로 어떻게 할지 약속해요.</div>
    </div>
    <div id="apEx" class="hidden"><div class="tipbox">예시: “${esc(c.ex.join(" "))}”</div></div>
    <div class="tipbox">사과를 받는 친구는 “사과해 줘서 고마워.”라고 대답해요. ‘미안하다고 했잖아!’는 진심 사과가 아니에요.</div>
    <div class="m-actions"><button class="btn sky" id="apShow">예시 보기</button><button class="btn mint" id="apOk">🤝 진심 사과 성공 (+2)</button><button class="btn gray" id="apNo">다음에 다시</button></div>`});
  document.getElementById("apShow").onclick=e=>{document.getElementById("apEx").classList.remove("hidden");e.target.remove();};
  document.getElementById("apOk").onclick=()=>{M.ok=true;addDict(c.ex.join(" "));finish(2,"진심 사과");};
  document.getElementById("apNo").onclick=()=>finish(0);
}

/* 짜증 바이러스 */
function cardVI(){
  const c=VI_CARDS[draw("VI")];let t=40;
  openModal({...head("VI"),body:`
    <div class="face">🦠</div>
    <p style="text-align:center;font-size:24px;font-weight:800;margin:0 0 10px">${esc(c.t)}</p>
    <div class="sit">🛡️ 퇴치 미션: ${esc(c.m)}</div>
    <div class="timer" id="viT">40</div>
    <p class="hint" style="text-align:center">40초 안에 미션을 해내면 바이러스 퇴치! 실패하면 말꽃 1개를 잃어요.</p>
    <div class="m-actions"><button class="btn mint" id="viOk">🛡️ 퇴치 성공!</button><button class="btn gray" id="viNo">퇴치 실패</button></div>`});
  sfx.bad();
  window._timer=setInterval(()=>{t--;const el=document.getElementById("viT");if(el)el.textContent=t>0?t:"시간 끝!";if(t<=0)clearInterval(window._timer);},1000);
  document.getElementById("viOk").onclick=()=>{closeModal();sfx.good();toast("🛡️ 짜증 바이러스 퇴치 성공! 말꽃을 지켰어요");nextTurn();};
  document.getElementById("viNo").onclick=()=>finish(-1);
}

/* 쉼표 (호흡) */
function cardBR(){
  openModal({...head("BR"),body:`
    <p style="margin:0;text-align:center">짜증이 날 때는 말하기 전에 <b>잠깐 쉼표!</b> 함께 숨을 쉬어 봐요.</p>
    <div class="breath-wrap"><div class="breath" id="br">준비</div><div id="brCnt" class="hint">3번 반복해요</div></div>
    <div id="brNext"></div>
    <div class="m-actions"><button class="btn gray" id="brSkip">건너뛰기</button></div>`});
  const el=document.getElementById("br");let n=0;
  const after=()=>{
    clearInterval(window._timer);
    document.getElementById("brSkip").parentElement.remove();
    document.getElementById("brNext").innerHTML=`<div class="frame"><div>팀원 한 명씩 지금 마음을 말해요.<br><b>“지금 내 기분은 ○○해. 왜냐하면 ○○ 때문이야.”</b></div></div>
      <div class="m-actions"><button class="btn mint" id="brOk">마음 나누기 완료 (+1)</button></div>`;
    document.getElementById("brOk").onclick=()=>{addDict("지금 내 기분은 ○○해. 왜냐하면 ○○ 때문이야.");finish(1,"쉼표");};
  };
  const cycle=()=>{
    if(n>=3){el.textContent="잘했어요!";el.classList.remove("in");after();return;}
    el.textContent="들이마시기";el.classList.add("in");
    setTimeout(()=>{if(!document.getElementById("br"))return;el.textContent="내쉬기";el.classList.remove("in");},4000);
    n++;document.getElementById("brCnt").textContent=`${n} / 3`;
  };
  setTimeout(cycle,600);window._timer=setInterval(cycle,8000);
  document.getElementById("brSkip").onclick=after;
}

/* 찬스 */
function cardLU(){
  const k=LU_CARDS[draw("LU")];const H=head("LU");
  if(k==="gift"){
    const others=S.teams.map((t,i)=>i).filter(i=>i!==S.turn);
    openModal({...H,body:`<div class="face">🎁</div><p style="text-align:center;font-size:24px;font-weight:800">선물 찬스!</p>
      <p style="text-align:center">다른 팀에게 말꽃 1개를 선물하면, 나누는 마음 덕분에 우리 팀은 말꽃 2개를 받아요.<br>선물할 때는 “○○팀, 선물이야!” 하고 말해요.</p>
      <div class="team-pick">${others.map(i=>`<button data-t="${i}" style="background:${S.teams[i].color}">${S.teams[i].emoji} ${esc(S.teams[i].name)}</button>`).join("")}</div>
      <div class="m-actions"><button class="btn gray" id="luNo">선물하지 않기</button></div>`});
    document.querySelectorAll("[data-t]").forEach(b=>b.onclick=()=>{award(+b.dataset.t,1);finish(2,"선물 찬스");});
    document.getElementById("luNo").onclick=()=>finish(0,"다음엔 나눠 볼까요?");
  } else if(k==="high5"){
    openModal({...H,body:`<div class="face">🙌</div><p style="text-align:center;font-size:24px;font-weight:800">하이파이브 찬스!</p><p style="text-align:center">모든 팀 말꽃 +1! 옆 친구와 하이파이브하며 “잘하고 있어!”라고 말해요.</p><div class="m-actions"><button class="btn mint" id="luOk">하이파이브!</button></div>`});
    document.getElementById("luOk").onclick=()=>{S.teams.forEach((t,i)=>{if(i!==S.turn)award(i,1);});finish(1,"하이파이브");};
  } else if(k==="jump2"){
    openModal({...H,body:`<div class="face">🚀</div><p style="text-align:center;font-size:24px;font-weight:800">순간 이동!</p><p style="text-align:center">앞으로 2칸 이동해서 그 칸의 미션을 해요.</p><div class="m-actions"><button class="btn mint" id="luOk">출발!</button></div>`});
    document.getElementById("luOk").onclick=()=>{closeModal();move(2,p=>{if(BOARD[p]==="LU")finish(1,"찬스");else landOn(p);});};
  } else if(k==="thanks"){
    openModal({...H,body:`<div class="face">💌</div><p style="text-align:center;font-size:24px;font-weight:800">감사 한 마디 찬스!</p><p style="text-align:center">선생님이나 우리 반 친구에게 고마운 점을 한 문장으로 말해요.<br><b>“○○해 주셔서/해 줘서 고마워요.”</b></p><div class="m-actions"><button class="btn mint" id="luOk">말했어요 (+2)</button><button class="btn gray" id="luNo">넘어가기</button></div>`});
    document.getElementById("luOk").onclick=()=>{addDict("○○해 줘서 고마워.");finish(2,"감사 한 마디");};
    document.getElementById("luNo").onclick=()=>finish(0);
  } else if(k==="rainbow"){
    openModal({...H,body:`<div class="face">🌈</div><p style="text-align:center;font-size:24px;font-weight:800">무지개 다리!</p><p style="text-align:center">출발 칸으로 순간 이동해서 월급을 받고 말꽃 +1도 받아요.</p><div class="m-actions"><button class="btn mint" id="luOk">무지개 건너기</button></div>`});
    document.getElementById("luOk").onclick=()=>{S.teams[S.turn].pos=0;S.teams[S.turn].money+=S.salary;finish(1,"무지개 다리 · 월급");};
  } else {
    openModal({...H,body:`<div class="face">🍀</div><p style="text-align:center;font-size:24px;font-weight:800">행운 찬스!</p><p style="text-align:center">말꽃 +2! 팀원끼리 “우리 팀 최고!” 외치기</p><div class="m-actions"><button class="btn mint" id="luOk">우리 팀 최고!</button></div>`});
    document.getElementById("luOk").onclick=()=>finish(2,"행운");
  }
}

/* ==========================================================
   규칙·사전·종료
   ========================================================== */
function showRules(){
  const fake=!S;if(fake)S={teams:[{emoji:"📖",name:"게임 방법"}],turn:0};
  openModal({icon:"📖",title:"게임 방법",color:"#ffe08a",who:"말꽃 마을 안내",body:`<div class="rules">
    <h3>🎯 목표</h3><ul><li>미션을 해내고 <b>말꽃 🌸</b>을 모아요. 말꽃 1개마다 <b>우리 반 마음 온도</b>가 3° 올라가요.</li><li>팀 순위보다 중요한 건 <b>우리 반 모두 함께 목표 온도에 도달하는 것</b>이에요.</li></ul>
    <h3>🎲 진행</h3><ul><li>차례가 된 팀이 주사위를 굴려(스페이스바도 가능) 칸에 도착하면 미션 카드가 열려요.</li><li>문제를 맞히고, 마지막에 <b>소리 내어 따뜻하게 말하면</b> 말꽃 +1 보너스!</li><li>출발 칸을 지나면 말꽃 +1.</li><li>🌸 <b>말꽃</b>은 따뜻한 말 점수(우리 반 온도), 🪙 <b>코인</b>은 땅을 사는 돈이에요.</li></ul>
    <h3>🏘️ 땅 사기 (부루마블 규칙)</h3><ul>
      <li>미션 칸은 모두 <b>땅</b>이에요. 빈 땅에서 <b>미션에 성공하면</b> 코인을 내고 땅을 살 수 있어요.</li>
      <li>다른 팀 땅에 도착하면 <b>사용료</b>를 내요. 그래도 미션을 하고, <b>성공하면 사용료 반값!</b></li>
      <li>우리 땅에 다시 도착해 미션에 성공하면 레벨을 올릴 수 있어요: 🏠 오두막 → 🏡 집 → 🏰 성 (최고 3단계).</li>
      <li>레벨이 높을수록 사용료가 올라가요. (땅값의 50% → 120% → 200%)</li>
      <li>출발 칸을 지날 때마다 <b>월급</b>을 받아요.</li>
      <li>코인이 모자라면 우리 땅을 은행에 반값에 팔아 사용료를 내요. 탈락은 없으니 월급을 모아 다시 일어서요!</li>
      <li>코인을 낼 때·받을 때도 고마움을 말로 표현해요.</li></ul>
    <h3>🗺️ 칸 종류</h3><ul>
      <li>💬 <b>나 전달법</b>: 사실-마음-이유-부탁 문장 완성 (최대 +3)</li>
      <li>🔄 <b>말 바꾸기</b>: 짜증 말을 배려하는 말로 (최대 +2)</li>
      <li>🔍 <b>마음 읽기</b>: 표정·몸짓 단서로 마음 알아채고 건넬 말 고르기 (최대 +3)</li>
      <li>👂 <b>잘 듣기</b>: 공감하며 되묻는 대답 고르기 (최대 +2)</li>
      <li>🎭 <b>말투 연기</b>: 같은 말을 두 가지 말투로 (+2)</li>
      <li>👏 <b>칭찬 릴레이</b>: 다른 팀 친구 칭찬하기 (두 팀 모두 +1)</li>
      <li>🤝 <b>진심 사과</b>: 인정-마음-다짐 3단계 (+2)</li>
      <li>🦠 <b>짜증 바이러스</b>: 40초 퇴치 미션, 실패 시 −1</li>
      <li>🫧 <b>쉼표</b>: 함께 숨 쉬고 지금 마음 나누기 (+1)</li>
      <li>🍀 <b>찬스</b>: 선물·하이파이브·순간 이동 등</li></ul>
    <h3>🙋 우리들의 약속</h3><ul><li>친구가 말할 때는 끝까지 들어요.</li><li>틀려도 놀리지 않고 “괜찮아, 다시 해 보자!”라고 말해요.</li><li>성공 판정은 다른 팀 친구들이 엄지 👍로 해 줘요.</li></ul>
    <h3>👩‍🏫 선생님 메뉴</h3><ul><li>점수판의 ± 버튼으로 말꽃을 직접 조정할 수 있어요.</li><li>게임은 이 컴퓨터에 자동 저장돼 ‘이어서 하기’가 가능해요.</li><li>‘📚 말 사전’에는 게임에서 연습한 따뜻한 말이 모여요.</li></ul>
    <div class="m-actions"><button class="btn" id="rClose">알겠어요!</button></div></div>`});
  if(fake)S=null;
  document.getElementById("rClose").onclick=closeModal;
}
function dictHtml(){
  return S.dict.length?`<div class="dict">${S.dict.map(p=>`<div>💬 ${esc(p)}</div>`).join("")}</div>`:`<p class="hint">아직 모인 말이 없어요. 미션을 하면 따뜻한 말이 차곡차곡 모여요.</p>`;
}
function showDict(){
  openModal({icon:"📚",title:"우리 반 따뜻한 말 사전",color:"#c3e6fb",who:`${S.dict.length}개 모음`,body:`${dictHtml()}<div class="m-actions"><button class="btn" id="dClose">닫기</button></div>`});
  document.getElementById("dClose").onclick=closeModal;
}
function showEnd(){
  closeModal();
  const assets=i=>S.teams[i].money+landsOf(i).reduce((s,p)=>s+landValue(p,S.lands[p].level),0);
  const ranked=S.teams.map((t,i)=>({...t,assets:assets(i),nl:landsOf(i).length})).sort((a,b)=>b.assets-a.assets||b.flowers-a.flowers);
  const kind=S.teams.map(t=>t).sort((a,b)=>b.flowers-a.flowers)[0];
  const medals=["🥇","🥈","🥉","🌟","🌟","🌟"];
  const total=S.teams.reduce((s,t)=>s+t.flowers,0);
  const reached=S.temp>=S.goal;
  const es=document.getElementById("endScreen");
  es.innerHTML=`<div class="end-box">
    <h1>${reached?"🎉":"🌸"} 말꽃 마을 결과</h1>
    <p style="text-align:center;font-size:22px;margin:0 0 18px">우리 반 마음 온도 <b>${S.temp}°</b> / 목표 ${S.goal}° · 모두 함께 피운 말꽃 <b>${total}송이</b><br>${reached?"목표 달성! 우리 반 모두가 함께 해냈어요.":"조금만 더 하면 목표에 닿아요. 다음 시간에 또 도전해요!"}</p>
    <h2>🏘️ 팀별 총자산 (코인 + 땅)</h2>
    ${ranked.map((t,i)=>`<div class="rank"><span style="font-size:28px">${medals[i]}</span><span style="font-size:28px">${t.emoji}</span><span style="flex:1">${esc(t.name)}<br><small style="font-weight:600;color:var(--soft)">코인 ${t.money} · 땅 ${t.nl}곳</small></span><span>🪙 ${t.assets}</span><span style="min-width:80px;text-align:right">🌸 ${t.flowers}</span></div>`).join("")}
    ${kind.flowers>0?`<p style="text-align:center;font-size:20px">💐 <b>따뜻한 말 상</b>: 말꽃을 가장 많이 피운 ${kind.emoji} ${esc(kind.name)}!</p>`:""}
    <h2 style="margin-top:26px">📚 오늘 연습한 따뜻한 말</h2>${dictHtml()}
    <h2 style="margin-top:26px">✏️ 돌아보기</h2>
    <div class="reflect">
      1. 오늘 들었던 말 중에서 가장 기분 좋았던 말은 무엇인가요?<br>
      2. 짜증이 날 때 나 전달법으로 어떻게 말할 수 있을까요?<br>
      3. 친구의 마음을 알아챌 수 있는 단서에는 무엇이 있었나요?<br>
      4. 내일 우리 반 친구에게 꼭 해 보고 싶은 따뜻한 말 한마디는?
    </div>
    <div class="m-actions no-print" style="margin:26px 0 40px">
      <button class="btn sky" onclick="window.print()">🖨️ 결과 인쇄</button>
      <button class="btn mint" id="backGame">게임으로 돌아가기</button>
      <button class="btn gray" id="newGame">새 게임</button>
    </div></div>`;
  es.classList.remove("hidden");
  if(reached){sfx.win();confetti(80);}
  document.getElementById("backGame").onclick=()=>es.classList.add("hidden");
  document.getElementById("newGame").onclick=()=>{if(!confirm("저장된 게임을 지우고 새로 시작할까요?"))return;clearSaved();S=null;es.classList.add("hidden");document.getElementById("game").classList.add("hidden");document.getElementById("setup").classList.remove("hidden");document.getElementById("resumeBtn").classList.add("hidden");};
}

document.addEventListener("keydown",e=>{
  if(e.code==="Space" && S && !document.getElementById("game").classList.contains("hidden") && document.getElementById("overlay").classList.contains("hidden") && document.getElementById("endScreen").classList.contains("hidden")){e.preventDefault();roll();}
});
</script>
