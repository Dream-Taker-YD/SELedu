<!doctype html><html><head><meta charset=utf8><meta name=viewport content="width=device-width,initial-scale=1,viewport-fit=cover"><style>:root{color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}html{scroll-padding-top:env(safe-area-inset-top,0px)}body{margin:0;padding:0;font:14px -apple-system,BlinkMacSystemFont,sans-serif;background:#fff;color:#000}img{max-width:100%}[hidden]:not([hidden=until-found i]){display:none!important}</style></head><body>
<title>마음 갈림길</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Jua&family=Gowun+Dodum&display=swap">
<style>
/* Layout: 한 장씩 넘기는 이야기 카드. 홈(상황 고르기) → 단계 카드 → 돌아보기 대시보드 */
:root{
  --bg:#eef3f1; --paper:#ffffff; --ink:#1f2a44; --muted:#5b6680; --line:#d5dfdc;
  --accent:#2f5bd3; --accent-ink:#ffffff; --sun:#ffcf4a; --sun-soft:#fff3c9;
  --good:#1f9d6b; --mid:#d99a17; --low:#d4553f;
  --cA:#7a5af5; --cM:#1f9d6b; --cS:#e0742d; --cR:#2f8fd3; --cD:#c2417a;
  --display:"Jua","Apple SD Gothic Neo","Malgun Gothic",sans-serif;
  --body:"Gowun Dodum","Apple SD Gothic Neo","Malgun Gothic",sans-serif;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#141a26; --paper:#1d2534; --ink:#e8edf7; --muted:#a3adc2; --line:#2e3a4f;
  --accent:#7d9cff; --accent-ink:#0f1626; --sun:#ffd666; --sun-soft:#3a3420;
  --good:#45c891; --mid:#f0b847; --low:#f07c66;
  --cA:#a28bff; --cM:#45c891; --cS:#f59a5b; --cR:#62b2f0; --cD:#e874a6; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#141a26; --paper:#1d2534; --ink:#e8edf7; --muted:#a3adc2; --line:#2e3a4f;
  --accent:#7d9cff; --accent-ink:#0f1626; --sun:#ffd666; --sun-soft:#3a3420;
  --good:#45c891; --mid:#f0b847; --low:#f07c66;
  --cA:#a28bff; --cM:#45c891; --cS:#f59a5b; --cR:#62b2f0; --cD:#e874a6; color-scheme:dark}
*{box-sizing:border-box}
body{background:var(--bg);color:var(--ink);font-family:var(--body);font-size:17px;line-height:1.6}
.wrap{max-width:820px;margin:0 auto;padding-block:24px 56px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));display:flex;flex-direction:column;gap:22px}
h1,h2,h3{font-family:var(--display);font-weight:400;margin:0;text-wrap:balance;letter-spacing:.01em}
h1{font-size:2.3rem;line-height:1.2}
h2{font-size:1.55rem;line-height:1.3}
h3{font-size:1.15rem}
p{margin:0}
.muted{color:var(--muted)}
button{font:inherit;color:inherit;cursor:pointer}
button:focus-visible,textarea:focus-visible,input:focus-visible{outline:3px solid var(--sun);outline-offset:2px}
.top{display:flex;justify-content:space-between;align-items:flex-end;gap:16px;flex-wrap:wrap}
.top .sub{margin-top:6px}
.namebox{display:flex;align-items:center;gap:8px;background:var(--paper);border:1px solid var(--line);border-radius:999px;padding:6px 8px 6px 16px}
.namebox label{font-size:.9rem;color:var(--muted);white-space:nowrap}
.namebox input{border:0;background:transparent;font:inherit;color:var(--ink);width:8em;padding:4px}
.legend{display:flex;flex-wrap:wrap;gap:8px}
.chip{display:inline-flex;align-items:center;gap:6px;font-size:.85rem;padding:3px 10px;border-radius:999px;background:var(--paper);border:1px solid var(--line)}
.dot{width:10px;height:10px;border-radius:50%;flex:none}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(230px,1fr));gap:14px}
.scard{position:relative;text-align:left;background:var(--paper);border:1px solid var(--line);border-radius:18px;padding:18px 18px 16px;display:flex;flex-direction:column;gap:8px;transition:transform .15s,border-color .15s}
.scard:hover{transform:translateY(-3px);border-color:var(--accent)}
.scard .tag{font-family:var(--display);font-size:.95rem;color:var(--paper);background:var(--tc);align-self:flex-start;padding:2px 12px;border-radius:999px}
.scard .meta{font-size:.85rem;color:var(--muted);display:flex;justify-content:space-between;margin-top:auto}
.scard .best{font-variant-numeric:tabular-nums}
.panel{background:var(--paper);border:1px solid var(--line);border-radius:20px;padding:20px}
.hist{display:flex;flex-direction:column;gap:2px}
.hrow{display:grid;grid-template-columns:1fr auto auto;gap:12px;align-items:center;padding:10px 4px;border-bottom:1px dashed var(--line);font-size:.95rem}
.hrow:last-child{border-bottom:0}
.hrow .pct{font-variant-numeric:tabular-nums;font-family:var(--display)}
.hrow button{border:1px solid var(--line);background:transparent;border-radius:10px;padding:2px 10px;font-size:.85rem}
.row{display:flex;gap:10px;flex-wrap:wrap;align-items:center}
.btn{border:0;border-radius:14px;padding:12px 20px;font-family:var(--display);font-size:1.05rem;background:var(--accent);color:var(--accent-ink)}
.btn.ghost{background:transparent;color:var(--ink);border:1.5px solid var(--line)}
.btn.small{padding:6px 12px;font-size:.9rem;border-radius:10px}
.btn.warn{background:var(--low);color:#fff}

/* play */
.playhead{display:flex;justify-content:space-between;align-items:center;gap:12px;flex-wrap:wrap}
.steps{display:flex;gap:6px;align-items:center}
.steps i{width:22px;height:8px;border-radius:4px;background:var(--line)}
.steps i.done{background:var(--accent)}
.steps i.now{background:var(--sun)}
.stage{background:var(--paper);border:1px solid var(--line);border-radius:22px;padding:26px 24px;display:flex;flex-direction:column;gap:18px;animation:rise .35s ease}
@keyframes rise{from{transform:translateY(8px)}to{transform:none}}
.prev{font-size:.92rem;background:var(--sun-soft);border-radius:12px;padding:8px 12px;color:var(--ink)}
.stepno{font-family:var(--display);color:var(--accent);font-size:1rem}
.situ{font-size:1.18rem;line-height:1.75;max-width:62ch}
.q{font-family:var(--display);font-size:1.1rem}
.choices{display:flex;flex-direction:column;gap:10px}
.choice{display:flex;gap:14px;align-items:flex-start;text-align:left;background:var(--bg);border:2px solid transparent;border-radius:16px;padding:14px 16px;font-size:1.03rem;transition:border-color .15s,background .15s}
.choice:hover{border-color:var(--accent)}
.choice .k{font-family:var(--display);flex:none;width:30px;height:30px;border-radius:50%;display:grid;place-items:center;background:var(--paper);border:1.5px solid var(--line)}

/* dashboard */
.dash{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1.15fr);gap:16px}
@media (max-width:680px){.dash{grid-template-columns:1fr}}
.big{display:flex;align-items:baseline;gap:8px}
.big b{font-family:var(--display);font-weight:400;font-size:3.6rem;line-height:1;font-variant-numeric:tabular-nums}
.badge{display:inline-block;font-family:var(--display);padding:4px 14px;border-radius:999px;background:var(--sun);color:#3a2c00}
.bars{display:flex;flex-direction:column;gap:12px}
.bar .lab{display:flex;justify-content:space-between;font-size:.95rem}
.bar .lab span:last-child{font-variant-numeric:tabular-nums;color:var(--muted)}
.track{height:12px;border-radius:6px;background:var(--bg);overflow:hidden;margin-top:4px}
.fill{height:100%;border-radius:6px}
.radar svg{width:100%;max-width:340px;display:block;margin:0 auto}
.review{display:flex;flex-direction:column;gap:10px}
.ritem{display:grid;grid-template-columns:34px minmax(0,1fr);gap:12px;padding:12px;border-radius:14px;background:var(--bg)}
.ritem .n{font-family:var(--display);width:34px;height:34px;border-radius:50%;display:grid;place-items:center;color:#fff}
.ritem .pick{font-weight:700}
.ritem .fb{font-size:.95rem;color:var(--muted);margin-top:2px}
.ritem .alt{font-size:.9rem;margin-top:6px;padding:6px 10px;border-left:3px solid var(--good);background:var(--paper);border-radius:0 8px 8px 0}
.q2{background:var(--good)} .q1{background:var(--mid)} .q0{background:var(--low)}
.hl{display:grid;grid-template-columns:1fr 1fr;gap:12px}
@media (max-width:560px){.hl{grid-template-columns:1fr}}
.hl > div{border-radius:16px;padding:14px;border:1.5px solid var(--line)}
.hl h3{margin-bottom:6px}
textarea{width:100%;min-height:110px;font:inherit;color:var(--ink);background:var(--bg);border:1px solid var(--line);border-radius:14px;padding:12px;resize:vertical}
.saved{font-size:.85rem;color:var(--good)}
.confirm{background:var(--sun-soft);border-radius:14px;padding:12px 14px;display:flex;gap:10px;align-items:center;flex-wrap:wrap}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
@media (max-width:480px){h1{font-size:1.9rem}.stage{padding:20px 16px}.situ{font-size:1.08rem}}
</style>

<div class="wrap" id="app"></div>

<script>
const COMP={
  A:{name:"자기인식",desc:"내 감정과 생각을 알아차리기",color:"var(--cA)"},
  M:{name:"자기관리",desc:"감정과 행동을 조절하기",color:"var(--cM)"},
  S:{name:"사회적 인식",desc:"다른 사람의 마음 헤아리기",color:"var(--cS)"},
  R:{name:"관계 기술",desc:"대화하고 협력하기",color:"var(--cR)"},
  D:{name:"책임 있는 의사결정",desc:"결과를 생각하고 바르게 선택하기",color:"var(--cD)"}
};
// choice: [보기, 점수(0~2), 역량, 돌아보기 설명, 다음 장면(선택)]
const SCENES=[
{id:"chat",title:"단톡방의 웃긴 사진",tag:"단톡방",color:"var(--cR)",intro:"반 단체 대화방에 친구의 사진이 올라왔어요.",start:"n1",nodes:{
n1:{t:"밤 9시, 반 단톡방에 민준이가 수업 시간에 졸고 있는 사진이 올라왔어요. 친구들이 줄줄이 'ㅋㅋㅋ'를 달고 있어요.",n:"n2",c:[
 ["나도 'ㅋㅋㅋ'를 단다.",0,"S","재미있어 보여도, 사진 속 친구가 어떤 기분일지 먼저 생각해 보면 좋아요.","n2b"],
 ["아무 반응 없이 지켜본다.",1,"A","불편함을 느끼고 끼지 않은 건 좋아요. 다음엔 그 마음을 행동으로 옮겨 볼 수도 있어요."],
 ["\"민준이가 싫어할 수도 있어. 지우는 게 어때?\"라고 쓴다.",2,"R","분위기에 휩쓸리지 않고 친구를 지키는 말을 했어요."]]},
n2b:{t:"잠시 뒤, 민준이에게서 개인 메시지가 왔어요. \"너도 웃었어?\"",n:"n3",c:[
 ["\"다들 웃길래 그냥 쓴 거야.\"라고 한다.",0,"R","남 탓으로 넘기면 친구 마음이 더 다칠 수 있어요."],
 ["\"응, 생각 없이 그랬어. 미안해.\"라고 솔직하게 사과한다.",2,"R","실수를 인정하는 솔직한 사과는 관계를 회복하는 첫걸음이에요."],
 ["메시지를 읽고 답하지 않는다.",0,"S","대답이 없으면 친구는 더 외로워질 수 있어요."]]},
n2:{t:"사진을 올린 지호가 단톡방에 \"장난인데 왜 이렇게 진지해?\"라고 썼어요.",n:"n3",c:[
 ["창피해서 \"농담이었어 ㅋㅋ\"라고 말을 바꾼다.",0,"A","내 생각이 옳았는데도 창피함 때문에 바꿨어요. 내 마음을 믿어 봐요."],
 ["불편한 마음을 알아차리고, 숨을 고른 뒤 답할 말을 생각한다.",2,"A","감정을 알아차리고 바로 반응하지 않은 것이 아주 좋았어요."],
 ["화가 나서 지호에게 거친 말을 쓴다.",0,"M","화를 그대로 쏟으면 다툼이 커지고, 처음 하려던 좋은 뜻도 가려져요."]]},
n3:{t:"민준이가 단톡방에 '...'만 남기고 방을 나갔어요.",n:"n4",c:[
 ["민준이에게 개인 메시지로 괜찮은지 묻는다.",2,"S","친구가 힘들 때 먼저 다가간 따뜻한 선택이에요."],
 ["다른 친구들이 알아서 하겠지, 하고 휴대폰을 덮는다.",0,"D","'누군가 하겠지'라고 모두가 생각하면 아무도 돕지 않게 돼요."],
 ["지호에게 \"민준이 나갔어. 사과하는 게 좋겠어.\"라고 말한다.",2,"R","문제를 만든 친구가 책임질 수 있게 차분히 이끌었어요."]]},
n4:{t:"민준이에게서 답장이 왔어요. \"다들 나를 비웃는 것 같아. 내일 학교 가기 싫어.\"",n:"n5",c:[
 ["\"별거 아니야, 신경 쓰지 마.\"",1,"S","위로하려는 마음은 좋지만, 친구의 속상함을 작게 만들 수 있어요."],
 ["\"그런 기분이 들 만해. 나는 네 편이야.\"",2,"S","친구의 감정을 그대로 인정해 주는 공감의 말이에요."],
 ["\"내일 선생님께 같이 말씀드려 볼까?\"",2,"D","혼자 해결하기 어려운 일에 믿을 만한 어른의 도움을 생각했어요."]]},
n5:{t:"다음 날 아침, 지호가 나에게 다가와 말해요. \"어제 너 때문에 분위기 다 망쳤잖아.\"",n:"n6",c:[
 ["\"미안해, 다음엔 가만히 있을게.\"",0,"R","옳은 행동을 하고도 사과할 필요는 없어요. 내 생각을 지켜도 괜찮아요."],
 ["\"나는 민준이 입장도 생각해야 한다고 생각했어.\"라고 차분히 말한다.",2,"R","공격하지 않으면서 내 생각을 분명히 전했어요."],
 ["못 들은 척 지나간다.",1,"M","다툼은 피했지만, 생각을 나눌 기회도 놓쳤어요."]]},
n6:{t:"선생님께서 반 친구들과 함께 '단톡방 약속'을 정해 보자고 하셨어요.",n:"n7",c:[
 ["\"사진을 올리기 전에 사진 속 친구에게 먼저 묻기\"를 제안한다.",2,"D","같은 일이 다시 일어나지 않게 하는 구체적인 약속을 생각했어요."],
 ["귀찮아서 아무 의견도 내지 않는다.",0,"D","우리 반의 규칙은 우리가 함께 만들 때 더 잘 지켜져요."],
 ["\"단톡방을 아예 없애자.\"고 한다.",1,"D","문제를 없애려는 마음은 이해되지만, 더 나은 방법도 함께 찾아봐요."]]},
n7:{t:"집에 돌아와 오늘 일을 일기장에 적기로 했어요.",n:null,c:[
 ["내가 용기를 냈거나, 내지 못한 순간을 솔직하게 적는다.",2,"A","나를 솔직하게 돌아보는 것이 자기인식의 시작이에요."],
 ["지호 때문에 생긴 일이라고만 적는다.",0,"A","남의 잘못만 보면 내가 배울 점을 놓치기 쉬워요."],
 ["다음에 비슷한 일이 생기면 할 행동을 적어 둔다.",2,"D","미리 계획해 두면 다음엔 더 쉽게 바른 선택을 할 수 있어요."]]}
}},
{id:"team",title:"모둠 발표 준비",tag:"모둠 활동",color:"var(--cD)",intro:"발표 날은 다가오는데, 모둠 친구가 맡은 일을 못 해 왔어요.",start:"n1",nodes:{
n1:{t:"모둠 발표가 3일 남았어요. 그런데 자료 조사를 맡은 서윤이가 아무것도 해 오지 않았어요.",n:"n2",c:[
 ["\"너 때문에 우리 모둠 망하겠다!\"라고 소리친다.",0,"M","화가 날 만한 상황이지만, 소리치면 문제는 해결되지 않고 마음만 다쳐요.","n2b"],
 ["왜 못 했는지 먼저 물어본다.",2,"S","판단하기 전에 사정을 묻는 것은 상대를 존중하는 태도예요."],
 ["말없이 내가 대신 다 하기로 한다.",1,"D","책임감은 좋지만, 혼자 떠안으면 지치고 친구도 배울 기회를 잃어요."]]},
n2b:{t:"서윤이가 눈물을 글썽이며 자리를 떠났어요. 모둠 친구들이 모두 나를 쳐다봐요.",n:"n3",c:[
 ["서윤이를 따라가 소리친 것을 사과한다.",2,"R","내 행동을 바로잡으려는 용기 있는 선택이에요."],
 ["\"쟤가 잘못했잖아.\"라고 친구들에게 말한다.",0,"R","잘잘못을 따지기보다, 지금 모둠에 필요한 게 무엇인지 생각해 봐요."],
 ["잠시 자리에 앉아 내가 왜 그렇게 화가 났는지 생각해 본다.",2,"A","화 밑에 있는 걱정과 불안을 알아차리는 것이 중요해요."]]},
n2:{t:"서윤이가 작은 목소리로 말해요. \"할머니가 편찮으셔서 주말 내내 병원에 있었어.\"",n:"n3",c:[
 ["\"그래도 했어야지.\"라고 한다.",0,"S","사정을 들은 뒤에도 친구 마음을 헤아리지 못하면 서운함이 남아요."],
 ["\"힘들었겠다. 지금 할 수 있는 걸 같이 찾아보자.\"",2,"S","공감과 해결을 함께 담은 멋진 말이에요."],
 ["고개만 끄덕이고 다른 친구와 이야기한다.",1,"R","들어 준 건 좋지만, 말 한마디가 더 큰 힘이 될 수 있어요."]]},
n3:{t:"남은 시간 안에 끝내려면 모둠 역할을 다시 나눠야 해요.",n:"n4",c:[
 ["각자 잘하는 것과 할 수 있는 시간을 물어보고 나눈다.",2,"D","모두의 상황을 고려한 공정한 방법이에요."],
 ["내가 하고 싶은 쉬운 일부터 먼저 고른다.",0,"R","함께하는 일에서는 내 편함보다 모둠 전체를 먼저 생각해 봐요."],
 ["가위바위보로 정한다.",1,"D","공평하긴 하지만, 각자의 강점을 살리지는 못할 수 있어요."]]},
n4:{t:"발표 전날 밤 9시. 내가 맡은 부분이 아직 남았는데, 졸리고 게임도 하고 싶어요.",n:"n5",c:[
 ["\"게임 30분만 하고 해야지.\" (결국 못 끝냄)",0,"M","하고 싶은 것을 잠시 미루는 힘이 자기관리예요."],
 ["할 일 목록을 쓰고 가장 중요한 것부터 끝낸다.",2,"M","계획을 세워 차근차근 해낸 훌륭한 자기관리예요."],
 ["모둠 친구에게 연락해 도움을 요청한다.",2,"R","혼자 힘들 때 도움을 청하는 것도 중요한 능력이에요."]]},
n5:{t:"발표 연습 중에 지우가 말해요. \"네 부분 좀 너무 긴 것 같아.\"",n:"n6",c:[
 ["기분이 나빠서 \"네 거나 잘해.\"라고 한다.",0,"M","의견을 공격으로 받아들이면 대화가 막혀요."],
 ["\"어느 부분을 줄이면 좋을까?\"라고 묻는다.",2,"R","의견을 열린 마음으로 받아들이고 함께 방법을 찾았어요."],
 ["속상하지만 아무 말 없이 그대로 둔다.",1,"A","속상한 마음을 알아차렸다면, 그 마음을 말로 표현해 봐도 좋아요."]]},
n6:{t:"발표 당일, 서윤이가 긴장해서 말을 더듬고 멈춰 버렸어요.",n:"n7",c:[
 ["작게 \"괜찮아, 천천히 해.\"라고 응원한다.",2,"S","친구의 긴장을 알아채고 힘을 주는 따뜻한 응원이에요."],
 ["답답해서 서윤이 부분을 내가 대신 읽어 버린다.",1,"R","도우려는 뜻이었지만, 친구가 스스로 해낼 기회를 빼앗을 수 있어요."],
 ["다른 친구와 눈빛을 주고받으며 웃는다.",0,"S","작은 웃음도 긴장한 친구에게는 크게 느껴질 수 있어요."]]},
n7:{t:"발표가 끝나고, 선생님께서 모둠 활동 돌아보기를 써 보라고 하셨어요.",n:null,c:[
 ["우리 모둠이 잘한 점과 아쉬운 점을 함께 쓴다.",2,"D","균형 있게 돌아보면 다음 활동이 더 좋아져요."],
 ["서윤이 때문에 힘들었다고만 쓴다.",0,"S","친구의 사정과 노력도 함께 떠올려 봐요."],
 ["내가 거의 다 했다고 쓴다.",0,"A","내 노력도 소중하지만, 함께한 친구들의 몫도 보아야 해요."]]}
}},
{id:"dodge",title:"피구 결승에서 졌을 때",tag:"체육 시간",color:"var(--cM)",intro:"열심히 했는데 졌어요. 얼굴이 뜨거워져요.",start:"n1",nodes:{
n1:{t:"체육 시간 피구 결승전. 마지막 공을 놓쳐서 우리 팀이 졌어요. 상대 팀이 환호하고, 내 얼굴은 확 뜨거워졌어요.",n:"n2",c:[
 ["공을 바닥에 세게 던진다.",0,"M","화를 몸으로 터뜨리면 다른 사람이 다칠 수도 있어요.","n2b"],
 ["눈을 감고 천천히 심호흡을 세 번 한다.",2,"M","몸을 진정시키는 방법을 써서 감정을 조절했어요."],
 ["\"심판이 편파 판정했어!\"라고 외친다.",0,"D","속상한 마음을 남 탓으로 돌리면 문제가 커지기 쉬워요."]]},
n2b:{t:"튀어 오른 공이 지나가던 1학년 동생을 맞힐 뻔했어요. 선생님께서 나를 부르셨어요.",n:"n3",c:[
 ["\"일부러 그런 거 아니에요.\"라고만 한다.",1,"D","일부러가 아니었어도, 생길 뻔한 결과까지 생각해 보는 게 좋아요."],
 ["\"너무 화가 나서 그랬어요. 죄송합니다.\"라고 말한다.",2,"A","내 감정과 행동을 솔직하게 연결해서 말했어요."],
 ["대답하지 않고 땅만 본다.",0,"R","말하기 어려워도, 짧게라도 마음을 전해 보는 연습이 필요해요."]]},
n2:{t:"숨을 고르니 마음이 조금 가라앉았어요. 지금 내 기분에 이름을 붙인다면?",n:"n3",c:[
 ["\"그냥 짜증 나.\"",1,"A","감정을 알아차린 건 좋아요. 짜증 밑에 다른 감정도 숨어 있을 수 있어요."],
 ["\"속상하고, 아쉽고, 조금 창피해.\"",2,"A","여러 감정을 구체적으로 알아차린 훌륭한 자기인식이에요."],
 ["\"아무렇지도 않아.\"",0,"A","감정을 모른 척하면 나중에 더 크게 터질 수 있어요."]]},
n3:{t:"같은 팀 하준이가 말해요. \"너 때문에 졌잖아. 마지막 공 놓쳤잖아.\"",n:"n4",c:[
 ["\"너도 아웃됐잖아!\"라고 따진다.",0,"R","서로 탓하면 둘 다 더 속상해져요."],
 ["\"나도 아쉬워. 근데 그 말은 좀 속상해.\"라고 말한다.",2,"R","내 마음을 상대를 공격하지 않고 전하는 '나 전달법'이에요."],
 ["울면서 교실로 뛰어 들어간다.",0,"M","속상한 마음을 잠시 진정시킨 뒤 이야기해 볼 수 있어요."]]},
n4:{t:"상대 팀 주장 은서가 다가와 손을 내밀어요. \"재밌었어. 다음에 또 하자!\"",n:"n5",c:[
 ["손을 무시하고 돌아선다.",0,"S","은서의 좋은 마음을 받아 주지 못했어요."],
 ["악수하며 \"축하해.\"라고 말한다.",2,"S","지고도 상대를 인정하는 모습이 진짜 멋진 선수예요."],
 ["억지로 악수만 하고 아무 말도 안 한다.",1,"R","쉽지 않은 순간에 악수한 것만으로도 한 걸음 나아간 거예요."]]},
n5:{t:"교실에 돌아왔는데도 경기 장면이 자꾸 떠올라요. 수학 시간이 시작됐어요.",n:"n6",c:[
 ["수학 시간 내내 경기 생각만 한다.",0,"M","생각이 계속 떠오를 땐, 잠시 미뤄 두는 연습이 도움이 돼요."],
 ["\"쉬는 시간에 다시 생각하자.\" 하고 수업에 집중한다.",2,"M","생각을 잠시 내려놓고 지금 할 일에 집중했어요."],
 ["짝에게 계속 경기 얘기를 한다.",0,"S","짝의 수업 시간도 소중하다는 걸 생각해 봐요."]]},
n6:{t:"다음 주에 다시 경기가 있어요. 쉬는 시간에 우리 팀이 모였어요.",n:"n7",c:[
 ["지난 경기에서 잘 안 된 점과 작전을 함께 이야기한다.",2,"D","실패를 배움으로 바꾸는 좋은 선택이에요."],
 ["\"하준이는 빼자.\"고 한다.",0,"R","누군가를 빼는 건 팀을 약하게 만들고 상처를 남겨요."],
 ["\"어차피 또 질 거야.\"라고 한다.",0,"A","한 번의 결과로 나를 판단하지 않아도 괜찮아요."]]},
n7:{t:"집에 오니 부모님께서 \"오늘 학교 어땠어?\"라고 물으세요.",n:null,c:[
 ["졌다는 얘기는 숨기고 \"그냥 그랬어.\"라고 한다.",1,"A","말하기 싫은 날도 있지만, 마음을 나누면 가벼워지기도 해요."],
 ["속상했던 일과 내가 마음을 진정한 방법을 이야기한다.",2,"A","내 감정과 대처를 돌아보며 말하는 건 큰 성장이에요."],
 ["하준이가 나쁘다고 이야기한다.",0,"S","하준이도 속상해서 그랬을 수 있다는 걸 생각해 봐요."]]}
}},
{id:"new",title:"새로 온 전학생",tag:"새 친구",color:"var(--cS)",intro:"우리말이 아직 서툰 친구가 우리 반에 왔어요.",start:"n1",nodes:{
n1:{t:"우리 반에 전학생 리안이가 왔어요. 우리말이 아직 서툴러요. 쉬는 시간, 리안이는 혼자 자리에 앉아 있어요.",n:"n2",c:[
 ["다가가서 \"같이 놀래?\"라고 묻는다.",2,"R","새 친구에게 먼저 다가가는 용기는 큰 힘이 돼요."],
 ["친구들과 \"쟤 말투 좀 이상해.\"라고 속삭인다.",0,"S","작게 한 말도 상대는 다 느낄 수 있어요.","n2b"],
 ["신경은 쓰이지만 그냥 내 할 일을 한다.",1,"S","리안이를 알아차린 건 좋아요. 작은 행동 하나를 더해 볼까요?"]]},
n2b:{t:"리안이가 우리 쪽을 보더니 고개를 푹 숙였어요. 아마 들은 것 같아요.",n:"n3",c:[
 ["모른 척한다.",0,"S","상처받은 친구를 외면하면 마음의 거리가 더 멀어져요."],
 ["리안이에게 가서 \"아까 미안해.\"라고 말한다.",2,"R","실수를 바로 사과한 것이 정말 멋져요."],
 ["친구들에게 \"우리 이제 그만하자.\"라고 말한다.",2,"D","잘못된 분위기를 바꾸는 책임 있는 선택이에요."]]},
n2:{t:"점심시간, 리안이가 급식실 가는 길을 몰라 두리번거려요.",n:"n3",c:[
 ["\"같이 가자!\" 하고 길을 알려 준다.",2,"S","낯선 곳에서 느끼는 막막함을 헤아렸어요."],
 ["손가락으로 대충 방향만 가리킨다.",1,"R","알려 준 건 좋지만, 함께 가면 더 든든했을 거예요."],
 ["늦을까 봐 먼저 뛰어간다.",0,"S","잠깐의 기다림이 친구에게는 큰 도움이 될 수 있어요."]]},
n3:{t:"리안이가 반찬 하나를 먹지 않아요. 한 친구가 \"편식쟁이래요~\"라고 놀려요.",n:"n4",c:[
 ["같이 웃는다.",0,"S","놀림에 함께 웃으면 놀림을 키우게 돼요."],
 ["\"못 먹는 이유가 있을 수도 있잖아.\"라고 말한다.",2,"S","문화나 건강 등 다른 사정이 있을 수 있음을 헤아렸어요."],
 ["리안이에게 왜 안 먹냐고 큰 소리로 묻는다.",1,"R","궁금할 수 있지만, 모두 앞에서 묻는 건 부담이 될 수 있어요."]]},
n4:{t:"리안이가 자기 나라 인사말을 알려 주겠다며 수줍게 웃어요.",n:"n5",c:[
 ["재미있게 따라 해 보고, 우리말 인사도 알려 준다.",2,"R","서로의 문화를 주고받는 멋진 대화예요."],
 ["\"그거 배워서 뭐 해.\"라고 한다.",0,"S","친구의 소중한 것을 가볍게 여기면 마음이 닫혀요."],
 ["듣는 척만 하고 딴짓을 한다.",1,"R","관심을 보여 주면 친구는 더 용기를 낼 수 있어요."]]},
n5:{t:"내 단짝 친구가 서운한 얼굴로 말해요. \"너 요즘 리안이랑만 놀고 나랑은 안 놀아.\"",n:"n6",c:[
 ["\"그럼 너도 같이 놀자!\"라고 한다.",2,"R","모두를 이어 주는 좋은 방법이에요."],
 ["단짝이 화낼까 봐 리안이를 피하기 시작한다.",0,"D","한 친구를 위해 다른 친구를 외면하지 않아도 돼요."],
 ["\"네가 서운했구나. 몰랐어.\"라고 먼저 마음을 알아준다.",2,"S","단짝의 마음까지 헤아린 따뜻한 공감이에요."]]},
n6:{t:"모둠 활동 시간, 리안이가 질문을 이해하지 못해 연필을 든 채 멈춰 있어요.",n:"n7",c:[
 ["그림을 그리거나 쉬운 말로 다시 설명해 준다.",2,"S","친구가 이해할 수 있는 방법을 찾은 세심한 배려예요."],
 ["답을 그냥 대신 써 준다.",1,"D","빨리 끝나지만, 리안이가 배울 기회를 놓칠 수 있어요."],
 ["\"빨리 좀 해.\"라고 재촉한다.",0,"M","답답한 마음을 조금 참으면 친구가 더 편하게 할 수 있어요."]]},
n7:{t:"한 달 뒤, 리안이가 쪽지를 건넸어요. \"처음엔 너무 무서웠어. 고마워.\"",n:null,c:[
 ["리안이를 도우며 내가 배운 점을 곰곰이 생각해 본다.",2,"A","경험을 통해 나의 성장을 알아차렸어요."],
 ["\"별거 아니었어.\"라고 넘긴다.",1,"A","겸손도 좋지만, 내가 한 좋은 일을 인정해도 괜찮아요."],
 ["반 친구들에게 쪽지를 보여 주며 자랑한다.",0,"R","친구가 마음을 담은 쪽지는 소중히 간직해 주세요."]]}
}},
{id:"case",title:"망가진 친구의 필통",tag:"실수",color:"var(--cA)",intro:"장난치다 친구의 소중한 물건을 망가뜨렸어요. 아무도 못 봤어요.",start:"n1",nodes:{
n1:{t:"쉬는 시간에 장난을 치다가 도윤이의 새 필통을 떨어뜨렸어요. 지퍼가 고장 났어요. 주변에 본 사람은 아무도 없어요.",n:"n2",c:[
 ["몰래 제자리에 갖다 놓는다.",0,"D","아무도 안 봤어도, 내가 한 일은 내가 알고 있어요.","n2b"],
 ["도윤이에게 바로 사실대로 말한다.",2,"D","실수를 바로 인정하는 건 가장 용기 있는 선택이에요."],
 ["누가 물어보면 모른다고 해야겠다고 생각한다.",0,"D","거짓말은 또 다른 거짓말을 부르기 쉬워요.","n2b"]]},
n2b:{t:"도윤이가 필통을 보고 \"누가 이랬어?\" 하며 울상이 됐어요. 내 가슴이 쿵쾅거려요.",n:"n3",c:[
 ["끝까지 모른 척한다.",0,"D","모른 척하면 도윤이도 나도 계속 마음이 불편해요."],
 ["쿵쾅거리는 마음을 알아차리고, 용기를 내 사실대로 말한다.",2,"A","불안한 마음을 알아차리고도 바른 선택을 했어요."],
 ["\"아까 다른 반 애가 지나가는 거 봤어.\"라고 한다.",0,"R","다른 사람을 탓하면 더 큰 오해와 상처가 생겨요."]]},
n2:{t:"도윤이가 화를 내요. \"이거 생일 선물로 받은 거란 말이야!\"",n:"n3",c:[
 ["\"일부러 그런 것도 아닌데 왜 화를 내?\"라고 한다.",0,"S","일부러가 아니어도, 소중한 물건을 잃은 친구의 마음은 아파요."],
 ["\"소중한 거였구나. 정말 미안해.\"라고 사과한다.",2,"S","친구에게 그 물건이 어떤 의미인지 헤아린 진심 어린 사과예요."],
 ["나도 같이 언성을 높인다.",0,"M","둘 다 화를 내면 사과할 기회가 사라져요."]]},
n3:{t:"사과했지만 도윤이의 화가 아직 다 풀리지 않았어요.",n:"n4",c:[
 ["고칠 수 있는 방법을 같이 찾아보자고 한다.",2,"D","사과에 이어 책임지는 행동까지 생각했어요."],
 ["\"사과했잖아, 이제 그만해.\"라고 한다.",0,"R","사과를 받아들이는 데 시간이 필요한 친구도 있어요."],
 ["조금 시간을 주고 기다린다.",1,"S","친구의 마음이 풀릴 시간을 존중했어요."]]},
n4:{t:"집에 와서 부모님께 말씀드려야 할지 고민돼요. 혼날까 봐 무서워요.",n:"n5",c:[
 ["사실대로 말씀드리고 도움을 구한다.",2,"D","어려운 일을 믿을 만한 어른과 함께 해결하려 했어요."],
 ["말하지 않고 내 용돈으로 몰래 해결하려 한다.",1,"D","책임지려는 마음은 좋지만, 혼자 감당하지 않아도 돼요."],
 ["그냥 잊어버리기로 한다.",0,"A","불편한 마음을 피하면 문제는 그대로 남아 있어요."]]},
n5:{t:"다음 날, 친구 몇 명이 수군거려요. \"너 도윤이 필통 망가뜨렸다며?\"",n:"n6",c:[
 ["\"응, 내가 실수했고 사과했어.\"라고 담담하게 말한다.",2,"A","실수를 인정하는 나를 부끄러워하지 않아도 돼요."],
 ["\"도윤이가 소문냈지?\"라며 도윤이에게 따진다.",0,"R","따지기보다 오해가 없는지 차분히 물어보는 게 좋아요."],
 ["창피해서 화장실로 숨는다.",0,"M","창피한 마음은 자연스러워요. 잠깐 숨을 고르고 다시 나와도 괜찮아요."]]},
n6:{t:"필통을 고쳐 주자 도윤이가 말해요. \"고쳐 줘서 고마워. 근데 앞으로 교실에서 장난은 조심해.\"",n:"n7",c:[
 ["\"알았어, 나도 조심할게.\"라고 한다.",2,"R","친구의 부탁을 존중하며 관계를 다시 이어 갔어요."],
 ["\"너도 장난치잖아.\"라고 한다.",0,"R","되받아치면 겨우 회복된 관계가 다시 멀어질 수 있어요."],
 ["고개만 끄덕인다.",1,"R","알겠다는 표시는 했지만, 말로 전하면 더 잘 통해요."]]},
n7:{t:"비슷한 일이 다시 생기지 않으려면 어떻게 하면 좋을까요?",n:null,c:[
 ["교실에서 지킬 나만의 약속을 정한다.",2,"M","스스로 약속을 정하고 지키는 것이 자기관리예요."],
 ["다시는 친구 물건 근처에 가지 않는다.",1,"D","조심하는 건 좋지만, 너무 피하지 않아도 돼요."],
 ["운이 나빴을 뿐이라고 생각한다.",0,"A","내 행동에서 원인을 찾아야 다음에 달라질 수 있어요."]]}
}}
];

const KEY="sel-maeum-gil-v1";
function load(){try{return JSON.parse(localStorage.getItem(KEY))||{name:"",plays:[]}}catch(e){return {name:"",plays:[]}}}
function save(){try{localStorage.setItem(KEY,JSON.stringify(store))}catch(e){}}
let store=load(); if(!Array.isArray(store.plays))store.plays=[];
let run=null; // {sid,node,log:[]}
const app=document.getElementById("app");
const esc=s=>String(s).replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const sceneOf=id=>SCENES.find(s=>s.id===id);
function pathLen(sc){ // 최장 단계 수(표시용)
  let max=0;const walk=(id,d)=>{if(!id){max=Math.max(max,d);return}const n=sc.nodes[id];const nexts=new Set(n.c.map(c=>c[4]||n.n));nexts.forEach(x=>walk(x,d+1))};walk(sc.start,0);return max;}

function analyze(log){
  const per={};Object.keys(COMP).forEach(k=>per[k]={q:0,n:0});
  let tot=0;log.forEach(l=>{per[l.c].q+=l.q;per[l.c].n++;tot+=l.q});
  return {per,pct:Math.round(tot/(log.length*2)*100)};
}
function level(p){return p>=80?"마음 리더":p>=60?"마음 탐험가":p>=40?"마음 새싹":"다시 걸어 볼 길"}

/* ---------- 홈 ---------- */
function home(){
  run=null;
  const best={};store.plays.forEach(p=>{best[p.sid]=Math.max(best[p.sid]??0,p.pct)});
  app.innerHTML=`
  <header class="top">
    <div><h1>마음 갈림길</h1><p class="sub muted">상황 속에서 고르고, 그 선택이 어디로 이어지는지 따라가 보세요.</p></div>
    <div class="namebox"><label for="nm">내 이름</label><input id="nm" maxlength="12" placeholder="이름 쓰기" value="${esc(store.name||"")}"></div>
  </header>
  <div class="legend">${Object.values(COMP).map(c=>`<span class="chip"><span class="dot" style="background:${c.color}"></span>${c.name}</span>`).join("")}</div>
  <section class="grid">${SCENES.map(s=>{const L=pathLen(s);return `
    <button class="scard" data-s="${s.id}" style="--tc:${s.color}">
      <span class="tag">${s.tag}</span>
      <h3>${s.title}</h3>
      <p class="muted">${s.intro}</p>
      <span class="meta"><span>${L}단계</span><span class="best">${best[s.id]!=null?`최고 ${best[s.id]}점`:"아직 안 해 봄"}</span></span>
    </button>`}).join("")}</section>
  <section class="panel">
    <div class="row" style="justify-content:space-between;margin-bottom:8px"><h2>나의 기록</h2>${store.plays.length?`<button class="btn ghost small" id="clr">기록 모두 지우기</button>`:""}</div>
    <div id="cf"></div>
    ${store.plays.length?`<div class="hist">${store.plays.slice().reverse().map((p,i)=>{const idx=store.plays.length-1-i;return `
      <div class="hrow"><span>${esc(sceneOf(p.sid)?.title||"")}<br><span class="muted" style="font-size:.85rem">${new Date(p.at).toLocaleString("ko-KR",{month:"long",day:"numeric",hour:"2-digit",minute:"2-digit"})}</span></span>
      <span class="pct">${p.pct}점</span><button data-v="${idx}">돌아보기</button></div>`}).join("")}</div>`
      :`<p class="muted">아직 기록이 없어요. 위에서 상황 하나를 골라 시작해 보세요. 기록은 이 기기의 브라우저에만 저장돼요.</p>`}
  </section>`;
  document.getElementById("nm").oninput=e=>{store.name=e.target.value;save()};
  app.querySelectorAll(".scard").forEach(b=>b.onclick=()=>start(b.dataset.s));
  app.querySelectorAll("[data-v]").forEach(b=>b.onclick=()=>dashboard(store.plays[+b.dataset.v],+b.dataset.v));
  const clr=document.getElementById("clr");
  if(clr)clr.onclick=()=>{document.getElementById("cf").innerHTML=`<div class="confirm"><span>기록을 모두 지울까요? 되돌릴 수 없어요.</span><button class="btn warn small" id="yes">지우기</button><button class="btn ghost small" id="no">취소</button></div>`;
    document.getElementById("yes").onclick=()=>{store.plays=[];save();home()};document.getElementById("no").onclick=()=>document.getElementById("cf").innerHTML=""};
  window.scrollTo(0,0);
}

/* ---------- 진행 ---------- */
function start(sid){const sc=sceneOf(sid);run={sid,node:sc.start,log:[],total:pathLen(sc)};stage()}
function stage(){
  const sc=sceneOf(run.sid),nd=sc.nodes[run.node],step=run.log.length;
  const last=run.log[step-1];
  app.innerHTML=`
  <div class="playhead">
    <button class="btn ghost small" id="back">처음으로</button>
    <div class="steps" aria-label="${step+1}/${run.total}단계">${Array.from({length:run.total},(_,i)=>`<i class="${i<step?"done":i===step?"now":""}"></i>`).join("")}</div>
  </div>
  <article class="stage">
    <div class="row" style="justify-content:space-between"><span class="stepno">${step+1}단계 · ${sc.title}</span></div>
    ${last?`<p class="prev">지난 선택: ${esc(last.pick)}</p>`:""}
    <p class="situ">${esc(nd.t)}</p>
    <p class="q">나는 어떻게 할까?</p>
    <div class="choices">${nd.c.map((c,i)=>`<button class="choice" data-i="${i}"><span class="k">${"가나다"[i]}</span><span>${esc(c[0])}</span></button>`).join("")}</div>
  </article>`;
  document.getElementById("back").onclick=home;
  app.querySelectorAll(".choice").forEach(b=>b.onclick=()=>pick(+b.dataset.i));
  window.scrollTo(0,0);
}
function pick(i){
  const sc=sceneOf(run.sid),nd=sc.nodes[run.node],c=nd.c[i];
  run.log.push({node:run.node,i,pick:c[0],q:c[1],c:c[2]});
  const next=c[4]||nd.n;
  if(next){run.node=next;stage()}
  else{const a=analyze(run.log);const play={sid:run.sid,at:Date.now(),pct:a.pct,log:run.log,note:""};
    store.plays.push(play);save();dashboard(play,store.plays.length-1)}
}

/* ---------- 대시보드 ---------- */
function radar(per){
  const keys=Object.keys(COMP),cx=170,cy=150,R=100,N=keys.length;
  const pt=(i,r)=>{const a=-Math.PI/2+i*2*Math.PI/N;return [cx+r*Math.cos(a),cy+r*Math.sin(a)]};
  const val=k=>per[k].n?per[k].q/(per[k].n*2):0;
  let g="";[.25,.5,.75,1].forEach(f=>{g+=`<polygon points="${keys.map((_,i)=>pt(i,R*f).join(",")).join(" ")}" fill="none" stroke="var(--line)" stroke-width="1"/>`});
  keys.forEach((_,i)=>{const [x,y]=pt(i,R);g+=`<line x1="${cx}" y1="${cy}" x2="${x}" y2="${y}" stroke="var(--line)"/>`});
  const poly=keys.map((k,i)=>pt(i,R*Math.max(val(k),.04)).join(",")).join(" ");
  g+=`<polygon points="${poly}" fill="var(--accent)" fill-opacity=".22" stroke="var(--accent)" stroke-width="2.5" stroke-linejoin="round"/>`;
  keys.forEach((k,i)=>{const [x,y]=pt(i,R*Math.max(val(k),.04));g+=`<circle cx="${x}" cy="${y}" r="5" fill="${COMP[k].color}" stroke="var(--paper)" stroke-width="2"/>`;
    const [lx,ly]=pt(i,R+26);const anc=Math.abs(lx-cx)<8?"middle":lx>cx?"start":"end";
    g+=`<text x="${lx}" y="${ly+4}" text-anchor="${anc}" font-size="13" fill="var(--ink)" font-family="Gowun Dodum, sans-serif">${COMP[k].name}</text>`});
  return `<svg viewBox="0 0 340 300" role="img" aria-label="사회정서 역량 거미줄 그래프">${g}</svg>`;
}
function dashboard(play,idx){
  const sc=sceneOf(play.sid),a=analyze(play.log);
  const good=play.log.filter(l=>l.q===2),low=play.log.filter(l=>l.q===0);
  const used=Object.keys(COMP).filter(k=>a.per[k].n);
  const ranked=used.slice().sort((x,y)=>a.per[y].q/a.per[y].n-a.per[x].q/a.per[x].n);
  const strong=ranked[0],weak=ranked[ranked.length-1];
  const nm=store.name?`${esc(store.name)}의 `:"나의 ";
  app.innerHTML=`
  <header class="top"><div><p class="stepno">${sc.title} · 돌아보기</p><h1>${nm}선택 돌아보기</h1></div>
    <div class="row"><button class="btn ghost small" id="again">다시 해 보기</button><button class="btn small" id="home">다른 상황 고르기</button></div></header>
  <section class="dash">
    <div class="panel" style="display:flex;flex-direction:column;gap:14px">
      <div class="big"><b>${a.pct}</b><span class="muted">/ 100점</span></div>
      <span class="badge" style="align-self:flex-start">${level(a.pct)}</span>
      <p>${play.log.length}번의 선택 중 <b style="color:var(--good)">빛난 선택 ${good.length}번</b>, <b style="color:var(--mid)">괜찮은 선택 ${play.log.length-good.length-low.length}번</b>, <b style="color:var(--low)">다시 생각해 볼 선택 ${low.length}번</b>이었어요.</p>
      <div class="radar">${radar(a.per)}</div>
    </div>
    <div class="panel" style="display:flex;flex-direction:column;gap:16px">
      <h2>역량별 점수</h2>
      <div class="bars">${Object.keys(COMP).map(k=>{const p=a.per[k];const v=p.n?Math.round(p.q/(p.n*2)*100):null;return `
        <div class="bar"><div class="lab"><span><span class="dot" style="display:inline-block;background:${COMP[k].color};margin-right:6px"></span>${COMP[k].name}</span><span>${v==null?"이번엔 없음":v+"점 · "+p.n+"번"}</span></div>
        <div class="track"><div class="fill" style="width:${v||0}%;background:${COMP[k].color}"></div></div>
        <p class="muted" style="font-size:.82rem;margin-top:2px">${COMP[k].desc}</p></div>`}).join("")}</div>
      <div class="hl">
        <div style="border-color:var(--good)"><h3>나의 강점</h3><p>${COMP[strong].name}: ${COMP[strong].desc}를 잘했어요.</p></div>
        <div style="border-color:var(--mid)"><h3>키워 볼 힘</h3><p>${strong===weak?"모든 역량을 고르게 키워 봐요.":COMP[weak].name+": 다음엔 "+COMP[weak].desc+"에 마음을 써 봐요."}</p></div>
      </div>
    </div>
  </section>
  <section class="panel" style="display:flex;flex-direction:column;gap:12px">
    <h2>내가 걸어온 길</h2>
    <div class="review">${play.log.map((l,i)=>{const nd=sc.nodes[l.node],c=nd.c[l.i];
      const best=nd.c.reduce((m,x)=>x[1]>m[1]?x:m,nd.c[0]);
      return `<div class="ritem"><span class="n q${l.q}">${i+1}</span><div style="min-width:0">
        <p class="muted" style="font-size:.9rem">${esc(nd.t)}</p>
        <p class="pick">${esc(l.pick)} <span class="chip" style="margin-left:4px"><span class="dot" style="background:${COMP[l.c].color}"></span>${COMP[l.c].name}</span></p>
        <p class="fb">${esc(c[3])}</p>
        ${l.q===0?`<p class="alt">이렇게 해 볼 수도 있어요: ${esc(best[0])}</p>`:""}
      </div></div>`}).join("")}</div>
  </section>
  <section class="panel" style="display:flex;flex-direction:column;gap:10px">
    <h2>나의 다짐</h2>
    <label for="note" class="muted">다음에 비슷한 일이 생기면 나는 어떻게 하고 싶나요?</label>
    <textarea id="note" placeholder="예) 친구가 놀림받으면 먼저 괜찮은지 물어볼 거예요.">${esc(play.note||"")}</textarea>
    <div class="row"><button class="btn small" id="sv">다짐 저장하기</button><span class="saved" id="svmsg"></span></div>
  </section>`;
  document.getElementById("home").onclick=home;
  document.getElementById("again").onclick=()=>start(play.sid);
  document.getElementById("sv").onclick=()=>{play.note=document.getElementById("note").value;if(store.plays[idx])store.plays[idx].note=play.note;save();document.getElementById("svmsg").textContent="저장했어요."};
  window.scrollTo(0,0);
}
home();
</script>

</body></html>
